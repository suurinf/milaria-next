  <script type="text/babel" data-presets="react">
// calculator.jsx — Калькулятор v3 (с подвкладками art/rig и PNG+)

const { useState: calcState, useEffect: calcEffect, useMemo: calcMemo } = React;

function CalcChip({ row, lang, state, onToggle, onQty }) {
  const on = state[row.id]?.on || false;
  const qty = state[row.id]?.qty || 1;
  const label = lang === 'ru' ? row.ru : row.en;
  const showQty = row.qty && on;

  return (
    <div
      className={`calc2-chip ${on ? 'on' : 'off'}`}
      onClick={(e) => {
        if (e.target.closest('.calc2-chip-qty')) return;
        onToggle(row.id);
      }}
      role="button"
      tabIndex={0}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onToggle(row.id); } }}
    >
      <span className="calc2-chip-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </span>
      <span className="calc2-chip-label">{label}</span>
      <span className="calc2-chip-price">
        {on
          ? (lang === 'en' ? `$${((row.usd || 0) * qty).toLocaleString('en-US')}` : `${(row.rub * qty).toLocaleString('ru-RU')} ₽`)
          : (lang === 'en' ? `from $${(row.usd || 0).toLocaleString('en-US')}` : `от ${row.rub.toLocaleString('ru-RU')} ₽`)
        }
      </span>
      {showQty && (
        <div className="calc2-chip-qty" onClick={(e) => e.stopPropagation()}>
          <button type="button" onClick={() => {
            if (qty <= 1) { onToggle(row.id); }
            else { onQty(row.id, qty - 1); }
          }}>−</button>
          <span>×{qty}</span>
          <button type="button" onClick={() => onQty(row.id, qty + 1)}>+</button>
        </div>
      )}
      {row._admin && (
        <div className="calc2-chip-admin" onClick={(e) => e.stopPropagation()} style={{ display:'flex', gap:3, marginLeft:4 }}>
          <button className="admin-btn" style={{width:20,height:20,fontSize:10}} onClick={() => row._onEdit(row)}>✎</button>
          <button className="admin-btn danger" style={{width:20,height:20,fontSize:10}} onClick={() => row._onDelete(row.id)}>×</button>
        </div>
      )}
    </div>
  );
}

function CalculatorSection({ t, lang, admin }) {
  // Load options from Supabase; fall back to DEFAULT_CALC only BEFORE first load
  const calcRes = useResource('calc_options', [], { orderBy: 'sort_order' });
  const calcData = React.useMemo(() => {
    if (calcRes.items && calcRes.items.length > 0) {
      const tree = calcOptionsToTree(calcRes.items);
      // Force PNG variant order: PNG before PNG+
      if (tree.png && tree.png.variants && tree.png.variants.basic && tree.png.variants.plus) {
        const { basic, plus, ...rest } = tree.png.variants;
        tree.png.variants = { basic, plus, ...rest };
      }
      return tree;
    }
    // Before first load — show defaults so page isn't blank.
    // After load with empty data — respect it (user deleted everything).
    if (!calcRes.loaded) return DEFAULT_CALC;
    return {};
  }, [calcRes.items, calcRes.loaded]);
  const [activeTab, setActiveTab] = calcState('vtuber');
  const [activeVariant, setActiveVariant] = calcState({ vtuber: 'art', chibi: 'art', png: 'basic', illust: 'default' });
  const [contactOpen, setContactOpen] = calcState(false);
  const [calcEdit, setCalcEdit] = calcState(null);
  const [rushOrder, setRushOrder] = calcState(false);
  const [convWork, setConvWork] = calcState(false);


  const [state, setState] = calcState(() => loadLS('calc:state:v2', {
    'v-a-concept': { on: true, qty: 1 },
    'v-a-hair':    { on: true, qty: 1 },
    'v-a-costume': { on: true, qty: 1 },
  }));

  calcEffect(() => saveLS('calc:state:v2', state), [state]);

  function toggle(id) {
    setState({ ...state, [id]: { ...(state[id] || { qty: 1 }), on: !state[id]?.on } });
  }
  function setQty(id, qty) {
    setState({ ...state, [id]: { ...(state[id] || { on: true }), qty } });
  }

  const [sectionOrder, saveSectionOrder] = useSetting('calc_section_order', []);
  const rawTabKeys = Object.keys(calcData);
  // Order tabs by saved section order; unknown ones go to the end
  const tabKeys = [...rawTabKeys].sort((a, b) => {
    const ia = sectionOrder.indexOf(a), ib = sectionOrder.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });
  const [dragSec, setDragSec] = calcState(null);

  async function deleteSection(key) {
    if (!confirm(`Удалить раздел «${t.calculator.cats[key] || key}» со всеми опциями?`)) return;
    const toDelete = (calcRes.items || []).filter(i => i.category === key);
    for (const row of toDelete) { await calcRes.remove(row.id); }
    saveSectionOrder(sectionOrder.filter(k => k !== key));
    if (activeTab === key) {
      const rest = tabKeys.filter(k => k !== key);
      if (rest.length) setActiveTab(rest[0]);
    }
  }

  function moveSectionTo(fromKey, toKey) {
    if (fromKey === toKey) return;
    const order = tabKeys.slice();
    const from = order.indexOf(fromKey), to = order.indexOf(toKey);
    if (from < 0 || to < 0) return;
    order.splice(to, 0, order.splice(from, 1)[0]);
    saveSectionOrder(order);
  }

  async function addSubsection() {
    const name = prompt(lang === 'ru' ? 'Название подраздела:' : 'Subsection name:');
    if (!name || !name.trim()) return;
    const key = name.trim();
    if (cat.variants[key]) { alert('Такой подраздел уже есть'); return; }
    const id = 'sub-' + Date.now().toString(36);
    await calcRes.add({
      id, category: activeTab, variant: key, group_type: 'base',
      label_ru: lang === 'ru' ? 'Новая опция' : 'New option',
      label_en: 'New option', rub: 0, usd: 0, has_qty: false, sort_order: 0,
    });
    setTimeout(() => setActiveVariant(prev => ({ ...prev, [activeTab]: key })), 300);
  }

  async function deleteSubsection(key) {
    if (!confirm(lang === 'ru' ? `Удалить подраздел «${key}» со всеми опциями?` : `Delete subsection "${key}"?`)) return;
    const toDelete = (calcRes.items || []).filter(i => i.category === activeTab && i.variant === key);
    for (const row of toDelete) { await calcRes.remove(row.id); }
  }

  async function addSection() {
    const name = prompt(lang === 'ru' ? 'Название нового раздела:' : 'New section name:');
    if (!name || !name.trim()) return;
    const key = name.trim();
    if (calcData[key]) { alert('Такой раздел уже есть'); return; }
    // Create the section with a starter option so it appears as a tab
    const id = 'sec-' + Date.now().toString(36);
    await calcRes.add({
      id, category: key, variant: 'default', group_type: 'base',
      label_ru: lang === 'ru' ? 'Новая опция' : 'New option',
      label_en: 'New option', rub: 0, has_qty: false, sort_order: 0,
    });
    setTimeout(() => setActiveTab(key), 300);
  }

  // Snap activeTab to a valid one if current was deleted
  React.useEffect(() => {
    if (tabKeys.length && !calcData[activeTab]) setActiveTab(tabKeys[0]);
  }, [calcData]);

  const cat = calcData[activeTab] || calcData[tabKeys[0]] || { variants: {} };
  const variantKey = activeVariant[activeTab] || Object.keys(cat.variants)[0] || 'default';
  const variant = (cat.variants[variantKey]) || { base: [], addon: [] };

  const calcOptionFields = calcMemo(() => [
    { key: 'label_ru', label: 'Название (RU)', type: 'text', required: true, default: '' },
    { key: 'label_en', label: 'Label (EN)', type: 'text', default: '' },
    { key: 'rub', label: 'Цена ₽ (рус. версия)', type: 'number', min: 0, default: 0 },
    { key: 'usd', label: 'Цена $ (англ. версия)', type: 'number', min: 0, default: 0 },
    { key: 'has_qty', label: lang === 'ru' ? 'Есть количество?' : 'Has quantity?', type: 'select', default: 'false', options: [
      { value: 'false', label: lang === 'ru' ? 'Нет' : 'No' },
      { value: 'true', label: lang === 'ru' ? 'Да' : 'Yes' },
    ]},
    { key: 'group_type', label: lang === 'ru' ? 'Группа' : 'Group', type: 'select', default: 'base', options: [
      { value: 'base', label: lang === 'ru' ? 'Базовая' : 'Base' },
      { value: 'addon', label: lang === 'ru' ? 'Доп. опция' : 'Addon' },
    ]},
    { key: 'category', label: lang === 'ru' ? 'Раздел' : 'Section', type: 'select', default: activeTab,
      options: tabKeys.map(k => ({ value: k, label: t.calculator.cats[k] || k })) },
    { key: 'variant', label: lang === 'ru' ? 'Подраздел' : 'Subsection', type: 'select', default: variantKey, options: [
      { value: 'default', label: lang === 'ru' ? 'Основной' : 'Main' },
      { value: 'basic', label: 'PNG' },
      { value: 'plus', label: 'PNG+' },
      { value: 'art', label: lang === 'ru' ? 'Только арт' : 'Art only' },
      { value: 'rig', label: lang === 'ru' ? 'Арт + риг' : 'Art + rig' },
    ]},
  ], [lang, activeTab, variantKey, tabKeys.join(',')]);

  function handleSaveCalcOption(draft) {
    const payload = {
      ...draft,
      has_qty: draft.has_qty === 'true' || draft.has_qty === true,
      rub: parseInt(draft.rub) || 0,
      usd: parseInt(draft.usd) || 0,
    };
    const savedTab = activeTab;
    const savedVariant = { ...activeVariant };
    if (calcEdit.isNew) {
      // calc_options uses text id, not UUID — must generate one
      const prefix = (payload.category || 'x').charAt(0) + '-' + (payload.group_type || 'a').charAt(0);
      payload.id = prefix + '-' + Date.now().toString(36);
      calcRes.add(payload);
    } else {
      calcRes.update(calcEdit.item.id, payload);
    }
    // Restore tab position after re-render
    setTimeout(() => {
      setActiveTab(savedTab);
      setActiveVariant(savedVariant);
    }, 50);
  }

  // Price for the active language (no auto-conversion; RU=₽, EN=$)
  const PRICE = (row) => lang === 'en' ? (row.usd || 0) : (row.rub || 0);
  const fmtMoney = (n) => lang === 'en' ? `$${Math.round(n).toLocaleString('en-US')}` : `${Math.round(n).toLocaleString('ru-RU')} ₽`;

  // Current variant total
  const { total: variantTotal, lines } = calcMemo(() => {
    const all = [...variant.base, ...(variant.addon || [])];
    let total = 0;
    const lines = [];
    all.forEach((row) => {
      const s = state[row.id];
      if (s?.on) {
        const sum = PRICE(row) * (s.qty || 1);
        total += sum;
        lines.push({ id: row.id, label: lang === 'ru' ? row.ru : row.en, qty: s.qty || 1, sum, row });
      }
    });
    return { total, lines };
  }, [variant, state, lang]);

  // Global total across ALL categories and variants
  const { globalTotal, globalLines } = calcMemo(() => {
    let gt = 0;
    const gl = [];
    Object.values(calcData).forEach(cat => {
      Object.values(cat.variants).forEach(v => {
        [...v.base, ...(v.addon || [])].forEach(row => {
          const s = state[row.id];
          if (s?.on) {
            const sum = PRICE(row) * (s.qty || 1);
            gt += sum;
            gl.push({ id: row.id, label: lang === 'ru' ? row.ru : row.en, qty: s.qty || 1, sum });
          }
        });
      });
    });
    return { globalTotal: gt, globalLines: gl };
  }, [calcData, state, lang]);

  // Apply percentage modifiers: each multiplies the RUNNING total (sequential)
  const baseTotal = globalTotal;
  let total = baseTotal;
  if (rushOrder) total = Math.round(total * 1.5);
  if (convWork) total = Math.round(total * 1.5);

  const totalFmt = fmtMoney(total);

  // Sort variants in defined display order: plus before basic, art before rig
  const VARIANT_ORDER = { basic: 0, plus: 1, art: 0, rig: 1, default: 0 };
  const variantEntries = Object.entries(cat.variants)
    .sort((a, b) => (VARIANT_ORDER[a[0]] ?? 99) - (VARIANT_ORDER[b[0]] ?? 99));
  const showSubtabs = variantEntries.length > 1;

  return (
    <section className="page anim-in">
      <PageHead
        eyebrow={`✦ ${t.calculator.title} ✦`}
        title={t.calculator.title}
        subtitle={t.calculator.subtitle}
      />

      <div className="calc2-tabs">
        {tabKeys.map((key) => (
          <div key={key} className={`calc2-tab-wrap ${dragSec === key ? 'dragging' : ''}`}
            draggable={admin}
            onDragStart={admin ? () => setDragSec(key) : undefined}
            onDragOver={admin ? (e) => e.preventDefault() : undefined}
            onDrop={admin ? (e) => { e.preventDefault(); if (dragSec) moveSectionTo(dragSec, key); setDragSec(null); } : undefined}
            onDragEnd={admin ? () => setDragSec(null) : undefined}>
            <button
              className={`calc2-tab ${activeTab === key ? 'active' : ''}`}
              onClick={() => setActiveTab(key)}
            >
              {admin && <span className="calc2-tab-grip" title="Перетащить">⠿</span>}
              {t.calculator.cats[key] || key}
            </button>
            {admin && (
              <button className="calc2-tab-del" title="Удалить раздел"
                onClick={(e) => { e.stopPropagation(); deleteSection(key); }}>×</button>
            )}
          </div>
        ))}
        {admin && (
          <button className="calc2-tab" onClick={addSection}
            style={{ borderStyle: 'dashed', opacity: 0.8 }}
            title="Добавить новый раздел">
            + {lang === 'ru' ? 'Раздел' : 'Section'}
          </button>
        )}
      </div>

      {tabKeys.length === 0 && (
        <div style={{ textAlign: 'center', padding: '48px 20px', color: 'var(--text-dim)', fontFamily: 'var(--font-mono)', fontSize: 14 }}>
          {lang === 'ru' ? 'Опции калькулятора пусты.' : 'Calculator options are empty.'}
          {admin && (
            <div style={{ marginTop: 16 }}>
              <button className="add-btn" onClick={() => setCalcEdit({ item: { category: 'vtuber', variant: 'art', group_type: 'base' }, isNew: true })}>
                {lang === 'ru' ? '+ Добавить первую опцию' : '+ Add first option'}
              </button>
            </div>
          )}
        </div>
      )}

      {(showSubtabs || admin) && tabKeys.length > 0 && (
        <div className="calc2-subtabs">
          {variantEntries.map(([key, v]) => (
            <span key={key} className="calc2-subtab-wrap">
              <button
                className={`calc2-subtab ${variantKey === key ? 'active' : ''}`}
                onClick={() => setActiveVariant({ ...activeVariant, [activeTab]: key })}
              >{lang === 'ru' ? v.ru : v.en}</button>
              {admin && variantEntries.length > 1 && (
                <button className="calc2-subtab-del" title="Удалить подраздел"
                  onClick={() => deleteSubsection(key)}>×</button>
              )}
            </span>
          ))}
          {admin && (
            <button className="calc2-subtab" style={{ borderStyle: 'dashed', opacity: 0.8 }}
              onClick={addSubsection} title="Добавить подраздел">
              + {lang === 'ru' ? 'Подраздел' : 'Subsection'}
            </button>
          )}
        </div>
      )}

      <div className="calc2">
        <div className="calc2-options stagger-children" key={activeTab + variantKey}>
          <div className="calc2-group-label">{t.calculator.groupBase}</div>
          {variant.base.map((row) => (
            <CalcChip key={row.id} row={{...row, _admin: admin, _onEdit: (r) => setCalcEdit({ item: calcRes.items.find(x => x.id === r.id) || r, isNew: false }), _onDelete: (id) => calcRes.remove(id)}} lang={lang} state={state} onToggle={toggle} onQty={setQty} />
          ))}
          {variant.addon && variant.addon.length > 0 && (
            <>
              <div className="calc2-group-label">{t.calculator.groupAddon}</div>
              {variant.addon.map((row) => (
                <CalcChip key={row.id} row={{...row, _admin: admin, _onEdit: (r) => setCalcEdit({ item: calcRes.items.find(x => x.id === r.id) || r, isNew: false }), _onDelete: (id) => calcRes.remove(id)}} lang={lang} state={state} onToggle={toggle} onQty={setQty} />
              ))}
            </>
          )}
          {admin && (
            <div style={{ marginTop: 14 }}>
              <button className="add-btn" onClick={() => setCalcEdit({ item: { category: activeTab, variant: variantKey, group_type: 'addon' }, isNew: true })}>
                + {lang === 'ru' ? 'Добавить опцию' : 'Add option'}
              </button>
            </div>
          )}
        </div>

        {admin && calcEdit && (
          <EditItemModal
            open={true}
            onClose={() => setCalcEdit(null)}
            onSave={handleSaveCalcOption}
            fields={calcOptionFields}
            values={calcEdit.item}
            title={calcEdit.isNew ? (lang === 'ru' ? 'Новая опция' : 'New option') : (lang === 'ru' ? 'Редактировать' : 'Edit')}
            lang={lang}
          />
        )}

        <aside className="calc2-summary">
          <div className="calc2-summary-eyebrow">{t.calculator.result}</div>
          <div className="calc2-summary-val">{totalFmt}</div>
          <div className="calc2-summary-alt">{total > 0 ? '' : (lang === 'ru' ? 'ничего не выбрано' : 'nothing selected')}</div>

          {/* Modifier toggles */}
          <div className="calc2-modifiers">
            <button
              className={`calc2-modifier-btn ${rushOrder ? 'active' : ''}`}
              onClick={() => setRushOrder(r => !r)}>
              <span className="calc2-mod-icon">{rushOrder ? '⚡' : '○'}</span>
              <span className="calc2-mod-label">{lang === 'ru' ? 'Срочный заказ' : 'Rush order'}</span>
              <span className="calc2-mod-pct">+50%</span>
            </button>
            <button
              className={`calc2-modifier-btn ${convWork ? 'active' : ''}`}
              onClick={() => setConvWork(r => !r)}>
              <span className="calc2-mod-icon">{convWork ? '🎪' : '○'}</span>
              <span className="calc2-mod-label">{lang === 'ru' ? 'Конфиденциальная работа' : 'Confidential work'}</span>
              <span className="calc2-mod-pct">+50%</span>
            </button>
            {(rushOrder || convWork) && baseTotal > 0 && (
              <div className="calc2-modifier-breakdown">
                <span>{lang === 'ru' ? 'База:' : 'Base:'}</span>
                <span>{fmtMoney(baseTotal)}</span>
                {rushOrder && (
                  <>
                    <span>{lang === 'ru' ? 'Срочность +50%:' : 'Rush +50%:'}</span>
                    <span>{fmtMoney(baseTotal*0.5)}</span>
                  </>
                )}
                {convWork && (
                  <>
                    <span>{lang === 'ru' ? 'Конфиденц. +50%:' : 'Confidential +50%:'}</span>
                    <span>{fmtMoney((rushOrder ? baseTotal*1.5 : baseTotal)*0.5)}</span>
                  </>
                )}
                <span style={{ borderTop: '1px solid rgba(232,169,59,0.3)', paddingTop: 4, marginTop: 4, fontWeight: 'bold' }}>
                  {lang === 'ru' ? 'Итого:' : 'Total:'}
                </span>
                <span style={{ borderTop: '1px solid rgba(232,169,59,0.3)', paddingTop: 4, marginTop: 4, fontWeight: 'bold', color: 'var(--accent)' }}>
                  {fmtMoney(total)}
                </span>
              </div>
            )}
          </div>

          <ul className="calc2-summary-list">
            {globalLines.length === 0 && (
              <li className="calc2-summary-empty">
                {lang === 'ru' ? 'Ничего не выбрано' : 'Nothing selected'}
              </li>
            )}
            {globalLines.map((line) => (
              <li key={line.id} className="calc2-summary-line">
                <span>{line.label}{line.qty > 1 ? ` × ${line.qty}` : ''}</span>
                <span>{fmtMoney(line.sum, lang)}</span>
              </li>
            ))}
          </ul>

          {total > 0 && (
            <>
              <button className="btn btn-primary calc2-contact-btn" onClick={() => setContactOpen(true)}>
                {lang === 'ru' ? 'Связаться для заказа' : 'Contact to order'}
              </button>
              <div className="calc2-payment-note">
                {lang === 'ru' ? 'Оплата: ' : 'Payment: '}
                <span>Swift</span> · <span>OzonBank</span> · <span>Boosty</span><sup>*</sup> · <span>Hipolink</span><sup>*</sup>
                <em>{lang === 'ru' ? '* комиссия платформы' : '* platform fee'}</em>
              </div>
            </>
          )}

          <div className="calc2-summary-note">{t.calculator.note}</div>
        </aside>
      </div>

      <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} lang={lang} admin={admin} />
    </section>
  );
}

// ─── Contact modal ───
function ContactModal({ open, onClose, lang, admin }) {
  // ALL hooks must be before any conditional return
  const linksRes = useResource('links', DEFAULT_LINKS);
  const [editing, setEditing] = React.useState(false);
  const [editDraft, setEditDraft] = React.useState(null);

  if (!open) return null;

  // Filter for socials where you can write a DM + email
  const dmKinds = ['social', 'chat', 'mail'];
  const contactable = linksRes.items.filter(l => dmKinds.includes(l.kind));
  const finalLinks = contactable.map(l => l.kind === 'mail'
    ? { ...l, handle: 'milariayt@gmail.com', url: 'mailto:milariayt@gmail.com' }
    : l
  );
  if (!finalLinks.find(l => l.kind === 'mail')) {
    finalLinks.push({ id: 'email-default', label: 'Email', handle: 'milariayt@gmail.com', url: 'mailto:milariayt@gmail.com', kind: 'mail' });
  }

  function copy(text) {
    try { navigator.clipboard.writeText(text); } catch (e) {}
  }

  function startEdit(l) {
    setEditDraft({ ...l });
    setEditing(true);
  }
  function saveEdit() {
    if (!editDraft) return;
    if (editDraft._isNew) {
      linksRes.add({ label: editDraft.label, handle: editDraft.handle, url: editDraft.url, kind: editDraft.kind || 'social', sort_order: 99 });
    } else {
      linksRes.update(editDraft.id, { label: editDraft.label, handle: editDraft.handle, url: editDraft.url, kind: editDraft.kind });
    }
    setEditing(false);
    setEditDraft(null);
  }

  return (
    <Modal open={open} onClose={onClose}>
      <div style={{ paddingRight: 40 }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, letterSpacing: '0.04em', color: 'var(--accent)', marginBottom: 8, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <span>✦ {lang === 'ru' ? 'связаться' : 'contact'}</span>
          {admin && (
            <button className="admin-btn" style={{ fontSize: 11 }}
              onClick={() => setEditing(e => !e)}>
              {editing ? '✓ Готово' : '✎ Редактировать'}
            </button>
          )}
        </div>
        <h2 style={{ fontFamily: 'var(--font-display)', fontStyle: 'italic', fontSize: 38, margin: '0 0 12px', fontWeight: 500 }}>
          {lang === 'ru' ? 'Куда написать?' : 'Where to message?'}
        </h2>
        <p style={{ color: 'var(--text-muted)', margin: '0 0 28px', fontSize: 14, maxWidth: 540 }}>
          {lang === 'ru'
            ? 'Напиши мне в любую из соцсетей или на почту — обсудим детали заказа.'
            : "Reach out via any social or email — we'll discuss the details."
          }
        </p>

        {/* Admin editor */}
        {admin && editing && (
          <div style={{ marginBottom: 20, display: 'flex', flexDirection: 'column', gap: 8 }}>
            {linksRes.items.map(l => (
              <div key={l.id} style={{ display: 'flex', gap: 8, alignItems: 'center', padding: '8px 12px', borderRadius: 8, background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)' }}>
                <span style={{ flex: 1, fontSize: 13 }}>{l.label}</span>
                <span style={{ fontSize: 11, color: 'var(--text-dim)', fontFamily: 'var(--font-mono)', flex: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{l.handle || l.url}</span>
                <button className="admin-btn" style={{ fontSize: 10, padding: '4px 8px' }} onClick={() => startEdit(l)}>✎</button>
                <button className="admin-btn danger" style={{ fontSize: 10, padding: '4px 8px' }} onClick={() => linksRes.remove(l.id)}>×</button>
              </div>
            ))}
            <button className="btn" style={{ fontSize: 12, padding: '8px 14px', justifyContent: 'center' }}
              onClick={() => startEdit({ _isNew: true, label: '', handle: '', url: '', kind: 'social' })}>
              + {lang === 'ru' ? 'Добавить' : 'Add'}
            </button>
          </div>
        )}

        {/* Edit form */}
        {admin && editDraft && (

                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              </button>
            </a>
          ))}
        </div>
      </div>
    </Modal>
  );
}

  <script type="text/babel" data-presets="react">
// sections-misc.jsx — Прайс, Долги, Ссылки

const { useState: miscState, useEffect: miscEffect } = React;

// ──────── Prices ────────
// Hue map for category-related hover images (per price key prefix)
const PRICE_HUE = {
  Portrait: 320, 'Half body': 280, 'Full body': 220, Chibi: 40, Smiles: 50,
  Icons: 30, Panels: 10, Allert: 10, 'Chibi PNG': 60, 'Half body PNG': 200,
  'Full body PNG': 240, 'VTuber model': 320, 'Chibi model v.1': 35,
  'Chibi model v.2': 50, Background: 200, 'Reference sheet': 20,
};
function priceHue(key) {
  for (const k in PRICE_HUE) if (key.startsWith(k)) return PRICE_HUE[k];
  return 40;
}
function priceTag(key) {
  if (/PNG/i.test(key)) return 'PNG';
  if (/VTuber/i.test(key)) return 'Live2D';
  if (/Chibi/i.test(key)) return 'Chibi';
  if (/Reference/i.test(key)) return 'Ref';
  if (/Background/i.test(key)) return 'BG';
  if (/Live2D/i.test(key)) return 'Live2D';
  return 'Art';
}

function PricesSection({ t, lang, admin }) {
  const priceDefaults = React.useMemo(() => DEFAULT_PRICES.map((p, i) => ({ ...p, label: p.key, sort_order: i })), []);
  const pricesRes = useResource('prices', priceDefaults);
  const prices = pricesRes.items.map(p => ({ ...p, key: p.label || p.key, key_en: p.label_en || p.key_en || '' }));
  const dragPrices = useDragReorder(pricesRes.items, pricesRes);

  function updatePrice(id, patch) {
    const dbPatch = { ...patch };
    if ('key' in dbPatch) { dbPatch.label = dbPatch.key; delete dbPatch.key; }
    if ('key_en' in dbPatch) { dbPatch.label_en = dbPatch.key_en; delete dbPatch.key_en; }
    pricesRes.update(id, dbPatch);
  }
  function deletePrice(id) {
    pricesRes.remove(id);
  }
  function addPrice(group) {
    pricesRes.add({ label: 'New item', rub: 1000, usd: 0, price_group: group || 'main' });
  }

  return (
    <section className="page anim-in">
      <PageHead
        eyebrow={`✦ ${t.prices.title} ✦`}
        title={t.prices.title}
        subtitle={t.prices.subtitle}
      />

      {(() => {
        const renderPriceCard = (p) => {
          const hue = priceHue(p.key);
          const tag = priceTag(p.key);
          // Inline SVG gradient as hover image (no asset needed; user will replace)
          const svg = encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
              <defs>
                <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="hsl(${hue}, 60%, 50%)"/>
                  <stop offset="100%" stop-color="hsl(${hue + 20}, 55%, 30%)"/>
                </linearGradient>
                <pattern id="p" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                  <line x1="0" y1="0" x2="0" y2="20" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
                </pattern>
              </defs>
              <rect width="600" height="200" fill="url(#g)"/>
              <rect width="600" height="200" fill="url(#p)"/>
              <text x="540" y="180" font-family="serif" font-style="italic" font-size="120" fill="rgba(255,255,255,0.18)" text-anchor="end">✦</text>
            </svg>`
          );
          const svgImg = `url("data:image/svg+xml;utf8,${svg}")`;
          const cardImg = p.image ? `url("${p.image}")` : svgImg;
          const dh = admin ? dragPrices.getHandlers(p) : {};
          return (
            <div className={`price-card ${dh.className || ''}`} key={p.id} style={{ '--card-img': cardImg }}
              draggable={dh.draggable}
              onDragStart={dh.onDragStart} onDragOver={dh.onDragOver}
              onDragLeave={dh.onDragLeave} onDrop={dh.onDrop} onDragEnd={dh.onDragEnd}>
              {admin && <span className="drag-handle" title="Перетащить">⠿</span>}
              <span className="price-card-tag">{tag}</span>
              <span className="price-card-name">
                {admin ? (
                  <Editable
                    value={lang === 'en' ? (p.key_en || '') : (p.key || '')}
                    onSave={(v) => updatePrice(p.id, lang === 'en' ? { key_en: v } : { key: v })}
                    admin={admin}
                  />
                ) : (lang === 'en' ? (p.key_en || p.key) : p.key)}
              </span>
              <span className="price-card-val">
                <span className="from">{t.prices.from}</span>
                {admin ? (
                  <>
                    {lang === 'en' ? (
                      <>
                        <span style={{ marginRight: 2 }}>$</span>
                        <EditableNumber value={p.usd || 0} onSave={(v) => updatePrice(p.id, { usd: v })} admin={admin} />
                      </>
                    ) : (
                      <>
                        <EditableNumber value={p.rub} onSave={(v) => updatePrice(p.id, { rub: v })} admin={admin} />
                        <span style={{ marginLeft: 4 }}>₽</span>
                      </>
                    )}
                  </>
                ) : (lang === 'en'
                  ? `$${(p.usd || 0).toLocaleString('en-US')}`
                  : `${(p.rub || 0).toLocaleString('ru-RU')} ₽`)}
              </span>
              {admin && (
                <button className="admin-btn danger" style={{ position: 'absolute', top: 8, left: 8 }} onClick={() => deletePrice(p.id)}>×</button>
              )}
              {admin && (
                <button className="admin-btn" style={{ position: 'absolute', top: 8, left: 40, fontSize: 10, whiteSpace: 'nowrap' }}
                  title="Переместить между блоками"
                  onClick={() => pricesRes.update(p.id, { price_group: (p.price_group === 'addon' ? 'main' : 'addon') })}>
                  {p.price_group === 'addon' ? '↑ в основной' : '↓ в доп.'}
                </button>
              )}
              {admin && (
                <div style={{ position: 'absolute', bottom: 8, right: 8, display: 'flex', gap: 4, zIndex: 2 }}>
                  <ImageUploader label="📷 фото" onUpload={(url) => pricesRes.update(p.id, { image: url })} />
                  {p.image && <button className="upload-btn" onClick={() => pricesRes.update(p.id, { image: '' })}>✕</button>}
                </div>
              )}
            </div>
          );
        };
        const mainItems = prices.filter(p => (p.price_group || 'main') !== 'addon');
        const addonItems = prices.filter(p => p.price_group === 'addon');
        return (
          <>
            <div className="prices-grid stagger-children">
              {mainItems.map(renderPriceCard)}
            </div>
            {admin && (
              <button className="add-btn" onClick={() => addPrice('main')}>+ {lang === 'ru' ? 'Добавить в основной' : 'Add to main'}</button>
            )}

            {(addonItems.length > 0 || admin) && (
              <>
                <div className="price-group-head">
                  <span className="price-group-line"></span>
                  <h3 className="price-group-title">{lang === 'ru' ? 'Дополнительные опции' : 'Additional options'}</h3>
                  <span className="price-group-line"></span>
                </div>
                <div className="prices-grid stagger-children">
                  {addonItems.map(renderPriceCard)}
                </div>
                {admin && (
                  <button className="add-btn" onClick={() => addPrice('addon')}>+ {lang === 'ru' ? 'Добавить доп. опцию' : 'Add addon'}</button>
                )}
              </>
            )}
          </>
        );
      })()}

    </section>
  );
}

// ──────── Debts ────────
// ─── Countdown timer to a target date ───
function DebtCountdown({ admin, lang }) {
  const [cfg, saveCfg] = useSetting('debt_deadline', {});
  const [now, setNow] = React.useState(Date.now());
  const [editing, setEditing] = React.useState(false);

  React.useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const target = cfg.date ? new Date(cfg.date).getTime() : null;
  const label = cfg.label || (lang === 'ru' ? 'До дедлайна' : 'Until deadline');

  if (!target && !admin) return null;

  let days = 0, hours = 0, mins = 0, secs = 0, passed = false;
  if (target) {
    let diff = Math.max(0, target - now);
    passed = target - now <= 0;
    days = Math.floor(diff / 86400000);
    hours = Math.floor((diff % 86400000) / 3600000);
    mins = Math.floor((diff % 3600000) / 60000);
    secs = Math.floor((diff % 60000) / 1000);
  }

  return (
    <div className="debt-countdown">
      <div className="debt-countdown-head">
        <span className="debt-countdown-label">⏳ {label}</span>
        {admin && (
          <button className="admin-btn" style={{ fontSize: 11 }} onClick={() => setEditing(e => !e)}>
            {editing ? '✓' : '✎'}
          </button>
        )}
      </div>

      {target && !passed && (
        <div className="debt-countdown-grid">
          <div className="cd-unit"><span className="cd-num">{days}</span><span className="cd-lbl">{lang === 'ru' ? 'дней' : 'days'}</span></div>
          <div className="cd-sep">:</div>
          <div className="cd-unit"><span className="cd-num">{String(hours).padStart(2, '0')}</span><span className="cd-lbl">{lang === 'ru' ? 'часов' : 'hours'}</span></div>
          <div className="cd-sep">:</div>
          <div className="cd-unit"><span className="cd-num">{String(mins).padStart(2, '0')}</span><span className="cd-lbl">{lang === 'ru' ? 'минут' : 'mins'}</span></div>
          <div className="cd-sep">:</div>
          <div className="cd-unit"><span className="cd-num">{String(secs).padStart(2, '0')}</span><span className="cd-lbl">{lang === 'ru' ? 'секунд' : 'secs'}</span></div>
        </div>
      )}
      {target && passed && (
        <div className="debt-countdown-done">{lang === 'ru' ? '⏰ Время вышло!' : '⏰ Time is up!'}</div>
      )}
      {!target && admin && (
        <div className="debt-countdown-empty">{lang === 'ru' ? 'Дата не задана' : 'No date set'}</div>
      )}

      {admin && editing && (
        <div className="debt-countdown-edit">
          <label className="login-field">
            <span>{lang === 'ru' ? 'Название' : 'Label'}</span>
            <input value={cfg.label || ''} placeholder={lang === 'ru' ? 'До дедлайна' : 'Until deadline'}
              onChange={e => saveCfg({ ...cfg, label: e.target.value })} />
          </label>
          <label className="login-field">
            <span>{lang === 'ru' ? 'Дата и время' : 'Date & time'}</span>
            <input type="datetime-local" value={cfg.date || ''}
              onChange={e => saveCfg({ ...cfg, date: e.target.value })} />
          </label>
        </div>
      )}
    </div>
  );
}

function DebtsSection({ t, admin, lang }) {
  const debtDefaults = React.useMemo(() => DEFAULT_DEBTS.map((d, i) => ({ ...d, stream_date: d.stream, sort_order: i })), []);
  const debtsRes = useResource('debts', debtDefaults);
  const debts = debtsRes.items.map(d => ({ ...d, stream: d.stream_date || d.stream }));

  function cycleStatus(id) {
    const d = debts.find(x => x.id === id);
    if (!d) return;
    const order = ['open', 'waiting', 'inProgress', 'done'];
    const next = order[(order.indexOf(d.status) + 1) % order.length];
    const progress = next === 'done' ? 100 : (next === 'open' || next === 'waiting' ? 0 : (d.progress || 50));
    debtsRes.update(id, { status: next, progress });
  }
  function updateDebt(id, patch) {
    const dbPatch = { ...patch };
    if ('stream' in dbPatch) { dbPatch.stream_date = dbPatch.stream; delete dbPatch.stream; }
    debtsRes.update(id, dbPatch);
  }
  function deleteDebt(id) { debtsRes.remove(id); }
  const [debtModal, setDebtModal] = miscState(null); // null | {item, isNew}

  const debtFields = React.useMemo(() => [
    { key: 'title', label: t.debts.title === 'Долги' ? 'Название' : 'Title', type: 'text', required: true, default: '' },
    { key: 'stream_date', label: t.debts.title === 'Долги' ? 'Дата стрима' : 'Stream date', type: 'date', default: new Date().toISOString().slice(0, 10) },
    { key: 'reason', label: t.debts.title === 'Долги' ? 'Причина' : 'Reason', type: 'text', default: '' },
    { key: 'status', label: t.debts.title === 'Долги' ? 'Статус' : 'Status', type: 'select', default: 'open', options: [
      { value: 'open', label: t.debts.status.open },
      { value: 'waiting', label: lang === 'ru' ? 'Ожидание' : 'Waiting' },
      { value: 'inProgress', label: t.debts.status.inProgress },
      { value: 'done', label: t.debts.status.done },
    ]},
    { key: 'progress', label: t.debts.title === 'Долги' ? 'Прогресс (%)' : 'Progress (%)', type: 'number', min: 0, max: 100, default: 0 },
    { key: 'section', label: lang === 'ru' ? 'Раздел' : 'Section', type: 'select', default: 'drawing', options: [
      { value: 'drawing', label: lang === 'ru' ? 'Долги по рисованию' : 'Drawing debts' },
      { value: 'games', label: lang === 'ru' ? 'Долги по играм' : 'Game debts' },
      { value: 'watching', label: lang === 'ru' ? 'Долги по просмотру' : 'Watching debts' },
      { value: 'vip', label: 'VIP' },
    ]},
  ], [t]);

  function addDebt() {
    setDebtModal({ item: null, isNew: true });
  }
  function editDebt(item) {
    setDebtModal({ item: { ...item, stream_date: item.stream_date || item.stream }, isNew: false });
  }
  function handleSaveDebt(draft) {
    if (debtModal.isNew) {
      debtsRes.add({
        title: draft.title,
        stream_date: draft.stream_date,
        reason: draft.reason,
        status: draft.status || 'open',
        section: draft.section || 'drawing',
        progress: draft.status === 'done' ? 100 : (draft.progress || 0),
      });
    } else {
      const patch = { ...draft };
      if ('stream' in patch) { patch.stream_date = patch.stream; delete patch.stream; }
      debtsRes.update(debtModal.item.id, patch);
    }
  }

  const DEBT_SECTIONS = [
    { key: 'drawing', label: lang === 'ru' ? 'Долги по рисованию' : 'Drawing debts' },
    { key: 'games', label: lang === 'ru' ? 'Долги по играм' : 'Game debts' },
    { key: 'watching', label: lang === 'ru' ? 'Долги по просмотру' : 'Watching debts' },
    { key: 'vip', label: 'VIP' },
  ];
  const byOrder = (a, b) => (a.sort_order || 0) - (b.sort_order || 0);
  const drawingItems  = debts.filter(d => (d.section || 'drawing') === 'drawing').sort(byOrder);
  const gamesItems    = debts.filter(d => d.section === 'games').sort(byOrder);
  const watchingItems = debts.filter(d => d.section === 'watching').sort(byOrder);
  const vipItems      = debts.filter(d => d.section === 'vip').sort(byOrder);
  const dragDrawing  = useDragReorder(drawingItems, debtsRes);
  const dragGames    = useDragReorder(gamesItems, debtsRes);
  const dragWatching = useDragReorder(watchingItems, debtsRes);
  const dragVip      = useDragReorder(vipItems, debtsRes);
  const sectionData = {
    drawing:  { items: drawingItems,  drag: dragDrawing },
    games:    { items: gamesItems,    drag: dragGames },
    watching: { items: watchingItems, drag: dragWatching },
    vip:      { items: vipItems,      drag: dragVip },
  };

  function renderDebtRow(d, drag) {
    const pct = d.progress ?? (d.status === 'done' ? 100 : d.status === 'inProgress' ? 50 : 0);
    const statusLabel = d.status === 'waiting' ? (lang === 'ru' ? 'Ожидание' : 'Waiting') : t.debts.status[d.status];
    const dh = admin ? drag.getHandlers(d) : {};
    return (
      <div key={d.id} className={`debt-row ${d.status} ${dh.className || ''}`}
        draggable={dh.draggable}
        onDragStart={dh.onDragStart} onDragOver={dh.onDragOver}
        onDragLeave={dh.onDragLeave} onDrop={dh.onDrop} onDragEnd={dh.onDragEnd}>
        {admin && <span className="drag-handle" title="Перетащить">⠿</span>}
        <div className="debt-icon">
          {d.status === 'done' ? '✓' : d.status === 'inProgress' ? '◐' : d.status === 'waiting' ? '⏳' : '○'}
        </div>
        <div className="debt-info">
          <span className="debt-title">
            <Editable value={d.title} onSave={(v) => updateDebt(d.id, { title: v })} admin={admin} />
          </span>
          <span className="debt-meta">
            {t.debts.streamFrom} {d.stream} · {t.debts.reason}: {d.reason}
          </span>
          <div className="debt-bar">
            <span style={{ width: `${pct}%` }}></span>
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
          <span className="debt-pct">
            <EditableNumber value={pct} onSave={(v) => updateDebt(d.id, { progress: Math.max(0, Math.min(100, v)) })} admin={admin} suffix="%" />
          </span>
          <span className="debt-status" onClick={() => admin && cycleStatus(d.id)} style={{ cursor: admin ? 'pointer' : 'default' }}>
            {statusLabel}
          </span>
        </div>
        {admin && (
          <div className="admin-actions" style={{ position: 'absolute', top: 8, right: 8, display: 'flex', gap: 4 }}>
            <button className="admin-btn" onClick={() => editDebt(d)} title="Edit">✎</button>
            <button className="admin-btn danger" onClick={() => deleteDebt(d.id)}>×</button>
          </div>
        )}
      </div>
    );
  }

  return (
    <section className="page anim-in">
      <PageHead
        eyebrow={`✦ ${t.debts.title} ✦`}
        title={t.debts.title}
        subtitle={t.debts.subtitle}
      />

      <DebtCountdown admin={admin} lang={lang} />

      {debts.length === 0 ? (
        <div className="empty">{t.debts.empty}</div>
      ) : (
        DEBT_SECTIONS.map(sec => {
          const { items, drag } = sectionData[sec.key];
          if (items.length === 0 && !admin) return null;
          return (
            <div key={sec.key} className="debt-section">
              <div className="debt-section-head">
                <span className="debt-section-line"></span>
                <h3 className="debt-section-title">{sec.label}</h3>
                <span className="debt-section-line"></span>
              </div>
              {items.length === 0 ? (
                <div className="empty" style={{ padding: '16px', fontSize: 13, opacity: 0.6 }}>{t.debts.empty}</div>
              ) : (
                <div className="debt-list">
                  {items.map(d => renderDebtRow(d, drag))}
                </div>
              )}
            </div>
          );
        })
      )}

      {admin && (
        <button className="add-btn" onClick={addDebt}>+ {t.debts.title === 'Долги' ? 'Добавить долг' : 'Add debt'}</button>
      )}

      {admin && (
        <EditItemModal
          open={!!debtModal}
          onClose={() => setDebtModal(null)}
          onSave={handleSaveDebt}
          fields={debtFields}
          values={debtModal?.item}
          title={debtModal?.isNew ? (t.debts.title === 'Долги' ? 'Новый долг' : 'New debt') : (t.debts.title === 'Долги' ? 'Редактировать' : 'Edit')}
          lang={t.debts.title === 'Долги' ? 'ru' : 'en'}
        />
      )}
    </section>
  );
}

const LINK_ICONS = {
  Twitch:    { glyph: 'T', bg: 'linear-gradient(135deg, #9146FF, #6629c9)' },
  YouTube:   { glyph: 'Y', bg: 'linear-gradient(135deg, #ff4d4d, #c1272d)' },
  'Twitter / X': { glyph: 'X', bg: 'linear-gradient(135deg, #1c1c1c, #444)' },
  Bluesky:   { glyph: 'B', bg: 'linear-gradient(135deg, #5dade2, #2980b9)' },

  Telegram:  { glyph: 'T', bg: 'linear-gradient(135deg, #29b6f6, #0277bd)' },
  Discord:   { glyph: 'D', bg: 'linear-gradient(135deg, #5865F2, #3b45c5)' },
  Boosty:    { glyph: 'B', bg: 'linear-gradient(135deg, #ff7e2e, #d95a14)' },
  'Ko-fi':   { glyph: 'K', bg: 'linear-gradient(135deg, #ff5e5b, #c5403f)' },

function LinksSection({ t, admin }) {
  const linkDefaults = React.useMemo(() => DEFAULT_LINKS.map((l, i) => ({ ...l, sort_order: i })), []);
  const linksRes = useResource('links', linkDefaults);
  const links = linksRes.items;

  function updateLink(id, patch) { linksRes.update(id, patch); }
  function deleteLink(id) { linksRes.remove(id); }
  const [linkModal, setLinkModal] = miscState(null);

  const linkFields = React.useMemo(() => [
    { key: 'label', label: t.links.title === 'Ссылки' ? 'Название' : 'Label', type: 'text', required: true, default: '' },
    { key: 'handle', label: 'Handle / @', type: 'text', default: '' },
    { key: 'url', label: 'URL', type: 'text', required: true, default: 'https://', placeholder: 'https://...' },
    { key: 'kind', label: t.links.title === 'Ссылки' ? 'Тип' : 'Kind', type: 'select', default: 'social', options: [
      { value: 'social', label: 'Social' },
      { value: 'stream', label: 'Stream' },
      { value: 'video', label: 'Video' },
      { value: 'chat', label: 'Chat' },
      { value: 'support', label: 'Support' },
      { value: 'mail', label: 'Email' },
    ]},
  ], [t]);

  function addLink() {
    setLinkModal({ item: null, isNew: true });
  }
  function editLink(item) {
    setLinkModal({ item, isNew: false });
  }
  function handleSaveLink(draft) {
    if (linkModal.isNew) {
      linksRes.add({ label: draft.label, handle: draft.handle, url: draft.url, kind: draft.kind || 'social' });
    } else {
      linksRes.update(linkModal.item.id, draft);
    }
  }

  return (
    <section className="page">
      <PageHead
        eyebrow={`✦ ${t.links.title} ✦`}
        title={t.links.title}
        subtitle={t.links.subtitle}
      />

      <div className="links-grid">
        {links.map((l) => {
          const icon = LINK_ICONS[l.label] || { glyph: l.label[0], bg: 'linear-gradient(135deg, var(--accent), var(--accent-deep))' };
          return (
            <a key={l.id} href={l.url} target="_blank" rel="noopener noreferrer" className="link-card"
               onClick={(e) => admin && e.preventDefault()}>
              <div className="link-icon" style={{ background: icon.bg }}>{icon.glyph}</div>
              <div className="link-info">
                <span className="link-label">
                  <Editable value={l.label} onSave={(v) => updateLink(l.id, { label: v })} admin={admin} />
                </span>
                <span className="link-handle">
                  <Editable value={l.handle} onSave={(v) => updateLink(l.id, { handle: v })} admin={admin} />
                </span>
              </div>
              {admin && (
                <div style={{ display: 'flex', gap: 4 }}>
                  <button className="admin-btn" onClick={(e) => { e.preventDefault(); editLink(l); }} title="Edit">✎</button>
                  <button className="admin-btn danger" onClick={(e) => { e.preventDefault(); deleteLink(l.id); }}>×</button>
                </div>
              )}
            </a>
          );
        })}
      </div>

      {admin && (
        <button className="add-btn" onClick={addLink}>+ {t.links.title === 'Ссылки' ? 'Добавить ссылку' : 'Add link'}</button>
      )}

      {admin && (
        <EditItemModal
          open={!!linkModal}
          onClose={() => setLinkModal(null)}
          onSave={handleSaveLink}
          fields={linkFields}
          values={linkModal?.item}
          title={linkModal?.isNew ? (t.links.title === 'Ссылки' ? 'Новая ссылка' : 'New link') : (t.links.title === 'Ссылки' ? 'Редактировать' : 'Edit')}
          lang={t.links.title === 'Ссылки' ? 'ru' : 'en'}
        />
      )}
    </section>
  );
}

function App() {
  const [lang, setLang] = appState(() => loadLS('lang', 'ru'));
  // ── URL routing ──
  const PATH_TO_TAB = { '/': 'home', '/queue': 'queue', '/portfolio': 'portfolio',
    '/calculator': 'calculator', '/prices': 'prices', '/debts': 'debts', '/tos': 'tos' };
  const TAB_TO_PATH = { home: '/', queue: '/queue', portfolio: '/portfolio',
    calculator: '/calculator', prices: '/prices', debts: '/debts', tos: '/tos' };
  function pathToTab(p) {
    const clean = (p || '/').replace(/\/+$/, '') || '/';
    return PATH_TO_TAB[clean] || 'home';
  }

  const [tab, setTabRaw] = appState(() => {
    if (typeof window !== 'undefined' && window.location) return pathToTab(window.location.pathname);
    return loadLS('tab', 'home');
  });

  // Sections are only hidden, never unmounted, so the page keeps whatever scroll
  // offset the previous tab had — you'd tap "Прайс" from halfway down Portfolio
  // and land in the middle of the price list. Remember a position per tab:
  // return to a tab you were reading and you're back where you left off; open a
  // fresh one and you start at the top.
  const scrollByTab = React.useRef({});
  const skipRestore = React.useRef(true);

  function setTab(newTab) {
    if (newTab === tab) return;
    scrollByTab.current[tab] = window.scrollY || 0; // remember where we stood
    skipRestore.current = false;
    setTabRaw(newTab);
    const path = TAB_TO_PATH[newTab] || '/';
    if (typeof window !== 'undefined' && window.location.pathname !== path) {
      try { window.history.pushState({ tab: newTab }, '', path); } catch(e) {}
    }
  }

  // Restore before paint so there is no visible jump.
  React.useLayoutEffect(() => {
    // Don't fight the browser's own restoration on first load / refresh.
    if (skipRestore.current) { skipRestore.current = false; return; }
    const y = scrollByTab.current[tab];
    window.scrollTo({ top: typeof y === 'number' ? y : 0, behavior: 'auto' });
  }, [tab]);

  // Sync state when user uses browser back/forward
  appEffect(() => {
    const handler = () => {
      scrollByTab.current[tab] = window.scrollY || 0;
      skipRestore.current = false;
      setTabRaw(pathToTab(window.location.pathname));
    };
    window.addEventListener('popstate', handler);
    return () => window.removeEventListener('popstate', handler);
  }, [tab]);

  // Per-route <title> + <html lang> — real routes deserve real titles (SEO + browser tabs)
  appEffect(() => {
    const site = 'Milaria';

      ru: { home: 'VTuber-художник: модели, риг, арт', queue: 'Очередь заказов',

            portfolio: 'Portfolio', calculator: 'Price calculator',
            prices: 'Prices', debts: 'Debts', tos: 'Terms of Service' },
    };
    const label = (titles[lang] || titles.ru)[tab] || site;
    document.title = tab === 'home' ? `${site} — ${label}` : `${label} | ${site}`;
    document.documentElement.lang = lang;
  }, [tab, lang]);
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const auth = useAuth();
  const [loginOpen, setLoginOpen] = appState(false);
  const admin = auth.isAdmin;

  appEffect(() => saveLS('lang', lang), [lang]);

  appEffect(() => {
    const root = document.documentElement;
    const pair = FONT_PAIRS[t.fontPair] || FONT_PAIRS.cormorant;

    root.style.setProperty('--font-display', pair.display);
    root.style.setProperty('--font-body', pair.body);
    root.style.setProperty('--accent', pal.accent);
    root.style.setProperty('--accent-deep', pal.deep);
    root.style.setProperty('--accent-soft', pal.soft);
    root.style.setProperty('--radius-card', t.radius + 'px');
  }, [t]);

  const i18n = I18N[lang];

  const tabs = [
    { id: 'home',       label: i18n.nav.home },
    { id: 'queue',      label: i18n.nav.queue },
    { id: 'portfolio',  label: i18n.nav.portfolio },
    { id: 'calculator', label: i18n.nav.calculator },
    { id: 'prices',     label: i18n.nav.prices },
    { id: 'debts',      label: i18n.nav.debts },
    { id: 'tos',        label: i18n.nav.tos },
  ];

  // Mount a section on first visit, then keep it mounted (hidden) so its state
  // survives tab switches. Mounting all 7 upfront made every section fetch its
  // data and run its timers on page load — even the ones nobody opened.
  const mountedTabs = React.useRef(new Set());
  mountedTabs.current.add(tab);

  const sections = [
    { id: 'home',       el: <HomeSection t={i18n} lang={lang} admin={admin} onGoTo={setTab} /> },
    { id: 'queue',      el: <QueueSection t={i18n} lang={lang} admin={admin} layout={t.layout} barStyle={t.barStyle} /> },
    { id: 'portfolio',  el: <PortfolioSection t={i18n} lang={lang} admin={admin} /> },
    { id: 'calculator', el: <CalculatorSection t={i18n} lang={lang} admin={admin} /> },
    { id: 'prices',     el: <PricesSection t={i18n} lang={lang} admin={admin} /> },
    { id: 'debts',      el: <DebtsSection t={i18n} admin={admin} lang={lang} /> },
    { id: 'tos',        el: <TosSection t={i18n} lang={lang} /> },
  ];

  const isHome = tab === 'home';

  async function runSeed() {
    if (!confirm(lang === 'ru'
      ? 'Заполнить базу демо-данными? Это перепишет всё что сейчас в Supabase.'
      : 'Seed database with demo data? This will overwrite anything currently in Supabase.')) return;
    setSeeding(true);
    try {
      const report = await seedDefaults();
      const errors = report.filter(r => r.error);
      if (errors.length) {
        alert((lang === 'ru' ? 'Ошибки при загрузке: ' : 'Errors: ') + errors.map(e => `${e.table}: ${e.error}`).join('\n'));
      } else {
        alert(lang === 'ru' ? '✓ Готово! Обнови страницу.' : '✓ Done! Reload the page.');
        location.reload();
      }
    } catch (e) {
      alert('Error: ' + e.message);
    } finally {
      setSeeding(false);
    }
  }

  function handleAdminToggle() {
    if (admin) {
      // already logged in — offer logout
      if (confirm(lang === 'ru' ? 'Выйти из режима редактирования?' : 'Sign out of edit mode?')) {
        auth.signOut();
      }
    } else {
      setLoginOpen(true);
    }
  }

  return (
    <>
      <BackgroundLayer bgImage={null} />
      <div className="app">
        <TopNav
          tabs={tabs}
          active={tab}
          onChange={setTab}
          lang={lang}
          onLangToggle={() => setLang(lang === 'ru' ? 'en' : 'ru')}
          admin={admin}
          onAdminToggle={handleAdminToggle}
          t={i18n}
        />

        {admin && (
          <div className="admin-bar">
            <span>
              <span className="admin-pill">✦ {i18n.common.adminOn}</span>
              <span className="admin-bar-info">
                {auth.email} · {lang === 'ru' ? 'кликай по тексту/числам чтобы редактировать' : 'click text/numbers to edit'}
              </span>
            </span>
            <span className="admin-bar-actions">
              <SiteFavicon admin={admin} />
              <button className="admin-btn" onClick={() => {
                if (confirm('Очистить локальный кеш и перезагрузить страницу? Это засинхронит с сервером.')) {
                  try {
                    Object.keys(localStorage).forEach(k => {
                      if (k.startsWith('milaria:cache:') || k.startsWith('milaria:setting:')) localStorage.removeItem(k);
                    });
                  } catch(e) {}
                  location.reload();
                }
              }} title="Синхронизировать с сервером" style={{ marginRight: 8 }}>⟳</button>
              <button className="admin-btn danger" onClick={() => auth.signOut()}>
                {lang === 'ru' ? 'выйти' : 'sign out'}
              </button>
            </span>
          </div>
        )}

        {isHome ?
          <main>
            {sections.filter(s => mountedTabs.current.has(s.id)).map(s => (
              <div key={s.id} style={{ display: tab === s.id ? 'block' : 'none' }}>{s.el}</div>
            ))}
            <FootOrnament />
          </main> :
          <main className="shell">
            {sections.filter(s => mountedTabs.current.has(s.id)).map(s => (
              <div key={s.id} style={{ display: tab === s.id ? 'block' : 'none' }}>{s.el}</div>
            ))}
            <FootOrnament />
          </main>
        }
      </div>

      <LoginModal open={loginOpen} onClose={() => setLoginOpen(false)} auth={auth} lang={lang} />

      <TweaksPanel>
        <TweakSection label={lang === 'ru' ? 'Типографика' : 'Typography'} />
        <TweakSelect
          label={lang === 'ru' ? 'Пара шрифтов' : 'Font pair'}
          value={t.fontPair}
          options={Object.entries(FONT_PAIRS).map(([k, v]) => ({ value: k, label: v.label }))}
          onChange={(v) => setTweak('fontPair', v)}
        />

        <TweakSection label={lang === 'ru' ? 'Цвет' : 'Color'} />
        <TweakColor
          label={lang === 'ru' ? 'Акцент' : 'Accent'}
          value={ACCENT_PALETTES[t.accent]?.accent}
          options={Object.values(ACCENT_PALETTES).map(p => p.accent)}
          onChange={(v) => {
            const key = Object.keys(ACCENT_PALETTES).find(k => ACCENT_PALETTES[k].accent === v);
            if (key) setTweak('accent', key);
          }}
        />

        <TweakSection label={lang === 'ru' ? 'Форма' : 'Shape'} />
        <TweakSlider
          label={lang === 'ru' ? 'Скругление углов' : 'Corner radius'}
          value={t.radius}
          min={0} max={32} unit="px"
          onChange={(v) => setTweak('radius', v)}
        />

        <TweakSection label={lang === 'ru' ? 'Прогресс-бары' : 'Progress bars'} />
        <TweakRadio
          label={lang === 'ru' ? 'Стиль' : 'Style'}
          value={t.barStyle}
          options={['classic', 'striped', 'ticks', 'minimal']}
          onChange={(v) => setTweak('barStyle', v)}
        />

        <TweakSection label={lang === 'ru' ? 'Очередь' : 'Queue'} />
        <TweakRadio
          label={lang === 'ru' ? 'Layout' : 'Layout'}
          value={t.layout}
          options={['list', 'cards', 'timeline']}
          onChange={(v) => setTweak('layout', v)}
        />
      </TweaksPanel>
    </>
  );
}

// ── Error boundary ──────────────────────────────────────────────────────
// Without this ANY render error blanks the whole site. Content here is
// admin-editable, so one malformed value must not take the page down.
class AppErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('[app crashed]', error, info); }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div style={{
        minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: 24, background: '#0c0a08', color: '#f0e9df', textAlign: 'center',
        fontFamily: "'IBM Plex Sans', system-ui, sans-serif",
      }}>
        <div style={{ maxWidth: 460 }}>
          <div style={{ fontSize: 42, marginBottom: 12 }}>✦</div>
          <h1 style={{ fontFamily: "'Cormorant Garamond', Georgia, serif", fontStyle: 'italic',
                       fontSize: 28, margin: '0 0 10px' }}>Что-то сломалось</h1>
          <p style={{ color: 'rgba(240,233,223,0.65)', fontSize: 14, lineHeight: 1.6, margin: '0 0 20px' }}>
            Страница не смогла отрисоваться. Обычно помогает перезагрузка —
            если нет, сбрось локальные данные кнопкой ниже.
          </p>
          <div style={{ display: 'flex', gap: 8, justifyContent: 'center', flexWrap: 'wrap' }}>
            <button onClick={() => window.location.reload()} style={{
              padding: '10px 20px', borderRadius: 22, cursor: 'pointer',
              background: '#e8a93b', color: '#1a1410', border: 0, fontWeight: 600 }}>
              Перезагрузить
            </button>
            <button onClick={() => {
              try {
                Object.keys(localStorage).forEach(k => { if (k.startsWith('milaria:')) localStorage.removeItem(k); });
              } catch (e) {}
              window.location.href = '/';
            }} style={{
              padding: '10px 20px', borderRadius: 22, cursor: 'pointer',
              background: 'transparent', color: '#f0e9df',
              border: '1px solid rgba(255,255,255,0.2)' }}>
              Сбросить и на главную
            </button>
          </div>
          <details style={{ marginTop: 22, textAlign: 'left' }}>
            <summary style={{ cursor: 'pointer', fontSize: 12, color: 'rgba(240,233,223,0.4)' }}>Подробности</summary>
            <pre style={{ fontSize: 11, color: 'rgba(240,233,223,0.5)', whiteSpace: 'pre-wrap',
                          marginTop: 8, maxHeight: 160, overflow: 'auto' }}>
              {String(this.state.error && (this.state.error.stack || this.state.error.message))}
            </pre>
          </details>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AppErrorBoundary><App /></AppErrorBoundary>
);

  </script>
</body>
</html>
