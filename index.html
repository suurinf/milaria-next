/* ── Status indicator lamps ── */
.status-lamp {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; margin-right: 6px; vertical-align: middle;
  animation: lamp-pulse 2s ease-in-out infinite;
}
.status-lamp[data-status="open"]     { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
.status-lamp[data-status="closed"]   { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
.status-lamp[data-status="waitlist"] { background: #eab308; box-shadow: 0 0 8px #eab308; }
@keyframes lamp-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .55; }
}
.hero-status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 16px; border-radius: 100px; font-size: 12px;
  font-family: var(--font-mono); letter-spacing: 0.08em;
  text-transform: uppercase; margin-bottom: 18px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
}

/* ── Upload button (unified across site) ── */
.upload-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 100px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-dim); font-size: 11px;
  font-family: var(--font-mono); letter-spacing: 0.04em;
  cursor: pointer; transition: all .15s;
  white-space: nowrap;
}
.upload-btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: var(--accent);
  color: var(--text);
}
.upload-btn:disabled { opacity: .5; cursor: wait; }

/* ═════ Banner arrows ═════ */
.banner-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #fff;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.2s, background 0.2s, transform 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.banner:hover .banner-arrow { opacity: 1; }
.banner-arrow:hover { background: rgba(0, 0, 0, 0.75); }
.banner-arrow:active { transform: translateY(-50%) scale(0.92); }
.banner-arrow-prev { left: 12px; padding-right: 2px; }
.banner-arrow-next { right: 12px; padding-left: 2px; }
@media (max-width: 768px) {
  .banner-arrow { opacity: 1; width: 32px; height: 32px; font-size: 18px; }
}

/* ═════ Larger socials bar — wrap + scroll ═════ */
.hero-socials-h {
  flex-wrap: wrap;
  max-width: 100%;
  gap: 8px;
}
.hero-soc-h {
  flex-shrink: 0;
}

/* ═════ Mobile responsive fixes ═════ */
@media (max-width: 768px) {
  /* TopNav — squeeze on mobile */
  .topnav-inner {
    padding: 12px 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .nav-tabs {
    order: 3;
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 4px;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tab { flex-shrink: 0; font-size: 13px; padding: 6px 10px; }
  .brand-status { display: none; }

  /* Hero — vertical stack */
  .hero-content {
    grid-template-columns: 1fr !important;
    gap: 24px;
    padding: 28px 16px;
  }
  .hero-title { font-size: clamp(32px, 8vw, 56px) !important; }
  .hero-sub { font-size: 14px; }
  .hero-side { display: none; }
  .hero-cta-row { flex-wrap: wrap; }

  /* Banner */
  .banner {
    grid-template-columns: 1fr !important;
    min-height: auto;
  }
  .banner-img { aspect-ratio: 16/10; min-height: 200px; }
  .banner-content { padding: 20px 16px; }
  .banner-title { font-size: clamp(20px, 5vw, 28px); }

  /* Portfolio cards */
  .pf-grid {
    grid-template-columns: 1fr 1fr !important;
    gap: 10px;
  }

  /* Page sections */
  .shell { padding: 20px 14px; }
  .page-section { padding: 20px 0; }
  .page-title { font-size: clamp(28px, 7vw, 40px); }

  /* Queue rows */
  .q-row {
    flex-wrap: wrap;
    gap: 8px;
  }
  .q-bar-wrap { width: 100%; }

  /* Calculator */
  .calc2-layout {
    grid-template-columns: 1fr !important;
  }
  .calc2-summary {
    position: static !important;
    margin-top: 16px;
  }

  /* Prices */
  .price-grid {
    grid-template-columns: 1fr !important;
  }

  /* Modal forms */
  .modal-content { padding: 20px 16px; }
}

@media (max-width: 480px) {
  .pf-grid { grid-template-columns: 1fr !important; }
  .hero-socials-h { gap: 6px; }
  .hero-soc-h { font-size: 11px; padding: 6px 12px; }
}

/* ═════ Portfolio carousel ═════ */
.pf-carousel-wrap {
  position: relative;
  margin: 16px 0;
}
.pf-carousel {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 8px 4px 16px;
  scroll-padding: 0 4px;
}
.pf-carousel::-webkit-scrollbar { display: none; }
.pf-carousel .pf-card {
  flex: 0 0 280px;
  scroll-snap-align: start;
  transition: transform 0.3s ease;
}
.pf-carousel .pf-card:hover {
  transform: translateY(-4px) scale(1.02);
}
.pf-card-type {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 2;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(8px);
  color: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.pf-carousel-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, transform 0.15s;
}
.pf-carousel-arrow:hover { background: var(--accent); }
.pf-carousel-arrow:active { transform: translateY(-50%) scale(0.92); }
.pf-carousel-prev { left: -8px; padding-right: 2px; }
.pf-carousel-next { right: -8px; padding-left: 2px; }
@media (max-width: 768px) {
  .pf-carousel .pf-card { flex: 0 0 220px; }
  .pf-carousel-arrow { width: 36px; height: 36px; font-size: 20px; }
}
@media (max-width: 480px) {
  .pf-carousel .pf-card { flex: 0 0 180px; }
  .pf-carousel-prev { left: -4px; }
  .pf-carousel-next { right: -4px; }
}

/* ═════ Coverflow Portfolio ═════ */
.pf-coverflow-outer {
  position: relative;
  padding: 80px 0 40px;
}
.pf-coverflow {
  position: relative;
  height: 600px;
  perspective: 1200px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}
.pf-cover-card {
  position: absolute;
  width: 420px;
  height: 540px;
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  transform-style: preserve-3d;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  will-change: transform, opacity;
}
.pf-cover-card.active {
  box-shadow: 0 32px 100px rgba(0,0,0,0.7), 0 0 0 1.5px rgba(255,255,255,0.12);
}
.pf-cover-card.active:hover .pf-cover-open-hint { opacity: 1; }
.pf-cover-img {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.04);
}
.pf-cover-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}
.pf-cover-img img.pf-cover-photo {
  object-fit: contain;
}
.pf-cover-card.active:hover .pf-cover-img img { transform: scale(1.04); }
.pf-cover-info {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 40px 20px 20px;
  background: linear-gradient(transparent, rgba(0,0,0,0.88));
  z-index: 2;
}
.pf-cover-type {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  display: block;
  margin-bottom: 4px;
}
.pf-cover-title {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 22px;
  font-weight: 500;
  color: #fff;
  margin: 0 0 4px;
}
.pf-cover-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(255,255,255,0.45);
}
.pf-cover-open-hint {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(8px);
  padding: 10px 20px;
  border-radius: 24px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: #fff;
  letter-spacing: 0.06em;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 5;
  white-space: nowrap;
  pointer-events: none;
}
/* Navigation bar */
.pf-coverflow-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 28px;
  padding: 0 20px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}
.pf-nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 10px 16px;
  color: var(--text);
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  font-family: var(--font-body);
}
.pf-nav-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
.pf-nav-next { flex-direction: row-reverse; }
.pf-coverflow-dots {
  display: flex;
  gap: 8px;
  align-items: center;
}
.pf-coverflow-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  cursor: pointer;
  transition: background 0.2s, width 0.2s;
}
.pf-coverflow-dots span.on {
  background: var(--accent);
  width: 20px;
  border-radius: 3px;
}
@media (max-width: 768px) {
  .pf-coverflow-outer { padding: 36px 50px 24px !important; }
  .pf-coverflow { height: 420px !important; }
  .pf-cover-card { width: 260px !important; height: 360px !important; }
  .pf-cover-card:nth-child(n) { --scale: 0.75; }
  .pf-cover-title { font-size: 18px; }
  .pf-coverflow-nav { padding: 0 8px; }
  .pf-nav-btn span:first-child, .pf-nav-btn span:last-child { display: none; }
}

/* ═════ Recent tile arrows ═════ */
.rtile-arr {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 5;
  opacity: 0;
  transition: opacity .15s, background .15s;
  line-height: 1;
}
.recent-tile:hover .rtile-arr { opacity: 1; }
.rtile-arr:hover { background: rgba(0,0,0,.75); }
.rtile-arr-l { left: 6px; padding-right: 2px; }
.rtile-arr-r { right: 6px; padding-left: 2px; }

/* ═════ Portfolio side arrows ═════ */
.pf-coverflow-outer {
  position: relative;
  padding: 80px 100px 40px;
}
.pf-side-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-60%);
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 12px 0;
  color: rgba(255,255,255,0.5);
  transition: color 0.2s;
}
.pf-side-arrow:hover { color: var(--accent); }
.pf-side-arrow svg {
  width: 32px; height: 32px;
  padding: 8px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(8px);
  transition: background .2s, border-color .2s;
  flex-shrink: 0;
}
.pf-side-arrow:hover svg {
  background: rgba(232,169,59,0.15);
  border-color: var(--accent);
}
.pf-side-arrow span {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  max-width: 50px;
  text-align: center;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pf-side-left  { left: 0; }
.pf-side-right { right: 0; flex-direction: column-reverse; }

.pf-coverflow-dots {
  display: flex;
  gap: 7px;
  justify-content: center;
  margin-top: 24px;
}
.pf-coverflow-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  cursor: pointer;
  transition: background .2s, width .2s;
  display: inline-block;
}
.pf-coverflow-dots span.on {
  background: var(--accent);
  width: 22px;
  border-radius: 3px;
}

@media (max-width: 768px) {
  .pf-coverflow-outer { padding: 24px 40px 16px; }
  .pf-side-arrow span { display: none; }
  .pf-side-arrow svg { width: 26px; height: 26px; padding: 6px; }
}
@media (max-width: 480px) {
  .pf-coverflow-outer { padding: 20px 32px 12px; }
}

/* ═════ Recent tile: smooth image layers + text glow ═════ */
.rt-layer {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  pointer-events: none;
}
.rt-placeholder {
  background-image: linear-gradient(135deg,
    hsl(var(--hue, 320) 55% 32%) 0%,
    hsl(var(--hue, 320) 35% 15%) 100%);
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 12px),
    linear-gradient(135deg, hsl(var(--hue, 320) 55% 32%) 0%, hsl(var(--hue, 320) 35% 15%) 100%);
}
.rt-img {
  opacity: 0;
  transition: opacity 0.8s ease;
}
.rt-img.show {
  opacity: 1;
}

/* Text glow on tile label */
.recent-tile-vlabel {
  text-shadow:
    0 0 20px rgba(0, 0, 0, 0.9),
    0 0 40px rgba(0, 0, 0, 0.8),
    1px 1px 0 rgba(0, 0, 0, 0.95),
    -1px -1px 0 rgba(0, 0, 0, 0.95),
    1px -1px 0 rgba(0, 0, 0, 0.95),
    -1px 1px 0 rgba(0, 0, 0, 0.95);
  paint-order: stroke fill;
}

.recent-tile-arrow {
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.9));
}

/* Portfolio page head — lower position */
#portfolio .page-head {
  padding-top: 32px;
  margin-bottom: 8px;
}

/* ═════ Calculator modifiers ═════ */
.calc2-modifiers {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.calc2-modifier-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.03);
  cursor: pointer;
  color: var(--text);
  text-align: left;
  width: 100%;
  transition: all 0.2s;
}
.calc2-modifier-btn:hover {
  border-color: var(--accent);
  background: rgba(232,169,59,0.06);
}
.calc2-modifier-btn.active {
  border-color: var(--accent);
  background: rgba(232,169,59,0.12);
  color: var(--accent);
}
.calc2-mod-icon { font-size: 16px; flex-shrink: 0; }
.calc2-mod-label { flex: 1; font-size: 13px; }
.calc2-mod-pct {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(255,255,255,0.08);
  color: var(--accent);
  flex-shrink: 0;
}
.calc2-modifier-btn.active .calc2-mod-pct {
  background: rgba(232,169,59,0.2);
}
.calc2-modifier-breakdown {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  padding: 8px 14px;
  border-radius: 8px;
  background: rgba(232,169,59,0.06);
  border: 1px solid rgba(232,169,59,0.2);
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(255,255,255,0.6);
}
.calc2-modifier-breakdown span:nth-child(even) {
  text-align: right;
  color: var(--accent);
}

/* ═════ T.O.S. section ═════ */
.tos-wrap {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.tos-card {
  background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 24px 28px;
  position: relative;
  overflow: hidden;
  animation: tosIn 0.5s cubic-bezier(.2,.8,.2,1) both;
}
.tos-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: linear-gradient(180deg, var(--accent), transparent);
  opacity: 0.6;
}
@keyframes tosIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.tos-card-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.tos-icon {
  width: 38px; height: 38px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(232,169,59,0.12);
  border: 1px solid rgba(232,169,59,0.3);
  color: var(--accent);
  font-size: 16px;
}
.tos-card-title {
  flex: 1;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
  margin: 0;
}
.tos-num {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 700;
  color: rgba(255,255,255,0.08);
  line-height: 1;
}
.tos-list {
  list-style: none;
  margin: 0; padding: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.tos-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text-muted);
  position: relative;
  padding-left: 18px;
}
.tos-item::before {
  content: '—';
  position: absolute;
  left: 0;
  color: var(--accent);
  opacity: 0.5;
}
.tos-highlight {
  background: rgba(232,169,59,0.07);
  border: 1px solid rgba(232,169,59,0.2);
  border-radius: 10px;
  padding: 12px 14px 12px 18px;
  color: var(--text);
}
.tos-highlight::before { display: none; }
.tos-badge {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 6px;
  background: var(--accent);
  color: #1a1410;
  align-self: flex-start;
}
.tos-footer {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-dim);
  padding: 20px;
  font-style: italic;
}
@media (max-width: 768px) {
  .tos-card { padding: 20px 18px; }
  .tos-card-title { font-size: 18px; }
  .tos-num { font-size: 22px; }
  .tos-item { font-size: 13.5px; }
}

/* ═════ Secret order: admin hover reveal ═════ */
.secret-row { position: relative; }
.secret-public {
  display: contents;
}
.secret-reveal {
  display: none;
}
/* Admin hover: swap public for reveal */
.secret-admin:hover .secret-public {
  display: none;
}
.secret-admin:hover .secret-reveal {
  display: contents;
  animation: secretFade 0.25s ease;
}
.secret-admin:hover {
  border-color: rgba(232, 169, 59, 0.3);
  background: rgba(232, 169, 59, 0.04);
}
.secret-admin::after {
  content: '🔒';
  position: absolute;
  top: 50%;
  right: 80px;
  transform: translateY(-50%);
  font-size: 14px;
  opacity: 0.3;
  transition: opacity 0.2s;
  pointer-events: none;
}
.secret-admin:hover::after {
  content: '🔓';
  opacity: 0.7;
}
@keyframes secretFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ═════ Fix select dropdown styling ═════ */
select option {
  background: #23201b !important;
  color: #f0e9df !important;
}
select {
  -webkit-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='%23d4a85a' stroke-width='1.5'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 14px center;
  padding-right: 36px !important;
}

/* prepaid tag */
.q-tag.prepaid {
  background: rgba(138, 180, 248, 0.15);
  color: #8ab4f8;
  border: 1px solid rgba(138, 180, 248, 0.3);
}

/* ═════ Queue deadline + hover image ═════ */
.q-deadline {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
  opacity: 0.8;
}
.q-deadline svg { opacity: 0.6; flex-shrink: 0; }

/* Done row image — stretched like price card */
.q-row.done { isolation: isolate; overflow: hidden; }
.q-row.done.has-image::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--card-img, none);
  background-size: cover;
  background-position: center right;
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.5s ease;
  transform: scale(1.05);
  z-index: -1;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 25%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0.9) 100%);
  mask-image: linear-gradient(90deg, transparent 0%, transparent 25%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0.9) 100%);
}
.q-row.done.has-image::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--bg-1) 28%, transparent 62%);
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: -1;
}
.q-row.done.has-image:hover::before { opacity: 0.75; transform: scale(1); }
.q-row.done.has-image:hover::after { opacity: 1; }
.q-row.done.has-image:hover { border-color: var(--accent); }

/* ═════ Drag handle ═════ */
.drag-handle {
  position: absolute;
  left: 2px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: rgba(255,255,255,0.25);
  cursor: grab;
  z-index: 8;
  padding: 4px;
  user-select: none;
  transition: color 0.2s;
}
.drag-handle:hover { color: var(--accent); }
.drag-handle:active { cursor: grabbing; }
.q-row, .price-card, .debt-row { transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s; }
.dragging { opacity: 0.4; transform: scale(0.98); }
.drag-over {
  box-shadow: 0 -3px 0 var(--accent);
  transform: translateY(2px);
}
.q-row[draggable="true"], .debt-row[draggable="true"] { padding-left: 24px; }

/* ═════ Debt countdown timer ═════ */
.debt-countdown {
  background: linear-gradient(135deg, rgba(232,169,59,0.1), rgba(232,169,59,0.03));
  border: 1px solid rgba(232,169,59,0.25);
  border-radius: 16px;
  padding: 20px 24px;
  margin-bottom: 28px;
}
.debt-countdown-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.debt-countdown-label {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.06em;
  color: var(--accent);
  text-transform: uppercase;
}
.debt-countdown-grid {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.cd-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 70px;
}
.cd-num {
  font-family: var(--font-display);
  font-size: 44px;
  font-weight: 600;
  color: var(--text);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.cd-lbl {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 6px;
}
.cd-sep {
  font-size: 36px;
  color: rgba(232,169,59,0.4);
  font-weight: 300;
  margin-top: -14px;
}
.debt-countdown-done {
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 28px;
  color: var(--accent);
  padding: 8px;
}
.debt-countdown-empty {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-dim);
  padding: 12px;
}
.debt-countdown-edit {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid rgba(232,169,59,0.2);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
@media (max-width: 768px) {
  .cd-num { font-size: 32px; }
  .cd-unit { min-width: 52px; }
  .cd-sep { font-size: 26px; }
}

/* 4-unit countdown (with seconds) */
.debt-countdown-grid .cd-unit { min-width: 60px; }
@media (max-width: 768px) {
  .debt-countdown-grid { gap: 6px; }
  .debt-countdown-grid .cd-unit { min-width: 44px; }
  .debt-countdown-grid .cd-num { font-size: 26px; }
  .debt-countdown-grid .cd-sep { font-size: 20px; }
  .debt-countdown-grid .cd-lbl { font-size: 9px; }
}

/* ═════ Coverflow image: full visible + blurred sides ═════ */
.pf-cover-img {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: rgba(255,255,255,0.04);
}
.pf-cover-blur {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(28px) brightness(0.55);
  transform: scale(1.25);
  z-index: 0;
}
.pf-cover-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 1;
}

/* ═════ Gallery grid: full image + blur fill ═════ */
.pf-gal-imgwrap {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.pf-gal-blur {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(24px) brightness(0.5);
  transform: scale(1.3);
  z-index: 0;
}
.pf-gal-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 1;
}

/* ═════ Calculator section tabs: drag + delete ═════ */
.calc2-tab-wrap {
  position: relative;
  display: flex;
  flex: 1;
  min-width: 100px;
}
.calc2-tab-wrap .calc2-tab {
  flex: 1;
  width: 100%;
}
.calc2-tab-wrap.dragging { opacity: 0.4; }
.calc2-tab-grip {
  font-size: 10px;
  opacity: 0.35;
  margin-right: 6px;
  cursor: grab;
  vertical-align: middle;
}
.calc2-tab-grip:active { cursor: grabbing; }
.calc2-tab-del {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(180,30,30,0.85);
  border: 1px solid rgba(255,120,120,0.4);
  color: #fff;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 5;
}
.calc2-tab-wrap:hover .calc2-tab-del { opacity: 1; }

/* ═════ Debt sections ═════ */
.debt-section { margin-bottom: 36px; }
.debt-section-head {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 18px;
}
.debt-section-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
}
.debt-section-title {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 22px;
  font-weight: 500;
  color: var(--accent);
  white-space: nowrap;
  margin: 0;
  letter-spacing: 0.02em;
}

/* Calculator subsection delete */
.calc2-subtab-wrap { position: relative; display: inline-flex; }
.calc2-subtab-del {
  position: absolute; top: -5px; right: -5px;
  width: 16px; height: 16px; border-radius: 50%;
  background: rgba(180,30,30,0.85); border: 1px solid rgba(255,120,120,0.4);
  color: #fff; font-size: 11px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s; z-index: 5;
}
.calc2-subtab-wrap:hover .calc2-subtab-del { opacity: 1; }

/* ═════ Price group divider ═════ */
.price-group-head {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 36px 0 22px;
}
.price-group-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
}
.price-group-title {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 22px;
  font-weight: 500;
  color: var(--accent);
  white-space: nowrap;
  margin: 0;
}

/* ═════ TOS: good/bad tone items ═════ */
.tos-tone-good {
  background: rgba(120, 200, 130, 0.07);
  border: 1px solid rgba(120, 200, 130, 0.22);
  border-radius: 10px;
  padding: 11px 14px 11px 14px !important;
  color: var(--text);
}
.tos-tone-bad {
  background: rgba(220, 80, 80, 0.06);
  border: 1px solid rgba(220, 80, 80, 0.22);
  border-radius: 10px;
  padding: 11px 14px 11px 14px !important;
  color: var(--text);
}
.tos-tone-good::before, .tos-tone-bad::before { display: none; }
.tos-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 22px; height: 22px;
  border-radius: 50%;
  font-size: 12px;
  font-weight: 700;
  margin-right: 4px;
}
.tos-mark-good { background: rgba(120,200,130,0.25); color: #8fdb9a; }
.tos-mark-bad  { background: rgba(220,80,80,0.25);  color: #ff8c8c; }

/* ═════ TOS compact two-column ═════ */
.tos-compact {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.tos-compact-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
}
.tos-compact-head {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 4px;
  font-weight: 600;
}
.tos-compact-good .tos-compact-head { color: #8fdb9a; }
.tos-compact-bad .tos-compact-head { color: #ff8c8c; }
.tos-chip {
  display: inline-block;
  padding: 6px 13px;
  border-radius: 8px;
  font-size: 13.5px;
}
.tos-chip-good { background: rgba(120,200,130,0.1); border: 1px solid rgba(120,200,130,0.25); color: var(--text); }
.tos-chip-bad { background: rgba(220,80,80,0.08); border: 1px solid rgba(220,80,80,0.25); color: var(--text); }
@media (max-width: 600px) {
  .tos-compact { grid-template-columns: 1fr; gap: 20px; }
}

.global-error {
  position: fixed; top: 0; left: 0; right: 0; z-index: 999999;
  background: #2a0c12; color: #ffd2da; padding: 14px 22px;
  font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.5;
  border-bottom: 1px solid #8a3a4a;
  white-space: pre-wrap; word-break: break-word;
}

  
/* ═════ Portfolio category emoji hover ═════ */
.pf-cover-emoji {
  position: absolute;
  top: 14px; right: 14px;
  font-size: 28px;
  opacity: 0;
  transform: scale(0.5) rotate(-20deg);
  transition: opacity 0.3s ease, transform 0.3s cubic-bezier(.2,.8,.2,1);
  z-index: 20;
  pointer-events: none;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
}
.pf-cover-card:hover .pf-cover-emoji,
.pf-cover-card.active .pf-cover-emoji {
  opacity: 1;
  transform: scale(1.2) rotate(0deg);
}

/* Recent tile video layer */
.rt-layer video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ═════ Portfolio cover: video / YouTube badge ═════ */
.pf-cover-play {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 54px; height: 54px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.55);
  border: 2px solid rgba(255, 255, 255, 0.85);
  color: #fff;
  font-size: 18px;
  padding-left: 3px;
  z-index: 3;
  pointer-events: none;
  backdrop-filter: blur(3px);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
  transition: transform 0.25s ease, background 0.25s ease;
}
.pf-cover-card:hover .pf-cover-play {
  transform: translate(-50%, -50%) scale(1.12);
  background: rgba(0, 0, 0, 0.7);
}

/* ═════ Accessibility: respect "reduce motion" OS setting ═════
   The site leans on 3D coverflow, floating orbs and fades — that can trigger
   nausea/vertigo for people with vestibular disorders. Content stays intact,
   only the movement stops. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .pf-cover-card { transition: none !important; }
}

/* ═════ Accessibility: visible keyboard focus ═════
   Without this, keyboard users cannot see where they are. */
:where(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ═════ Skeleton loaders ═════
   Shown while data is still on its way, so the UI never claims "empty"
   when it simply doesn't know yet. */
.skeleton {
  position: relative;
  overflow: hidden;
  background: rgba(245, 232, 212, 0.04);
  border: 1px solid var(--line);
}
.skeleton::after {

// ════════════════════════════════════════════════════════════
//  useResource — универсальный хук для одной таблицы
//

//
//  Если supabase не отвечает или таблица пуста, items = defaults
//  (так сайт работает даже при оффлайне).
// ════════════════════════════════════════════════════════════
// ── Request de-duplication ───────────────────────────────────────────────
// All sections render at once (hidden, not unmounted), so without this the same
// table/settings get fetched once per component — wasted requests and egress.
const _tableInflight = new Map();
function _fetchTableOnce(table, orderBy, version) {
  const key = `${table}|${orderBy}|${version}`;
  if (_tableInflight.has(key)) return _tableInflight.get(key);
  const p = _sbc.from(table).select("*").order(orderBy, { ascending: true })
    .then(r => r)
    .catch(e => ({ data: null, error: e }));
  _tableInflight.set(key, p);
  // Let the next mount re-fetch; this only collapses the initial burst.
  p.finally(() => setTimeout(() => _tableInflight.delete(key), 1000));
  return p;
}

// One request for the whole settings table instead of one per key.
let _allSettingsPromise = null;
function _fetchAllSettings() {
  if (_allSettingsPromise) return _allSettingsPromise;
  _allSettingsPromise = _sbc.from('settings').select('key,value')
    .then(({ data, error }) => {
      if (error) return {};
      const map = {};
      (data || []).forEach(r => { if (r && r.key) map[r.key] = r.value; });
      return map;
    })
    .catch(() => ({}));
  setTimeout(() => { _allSettingsPromise = null; }, 1000);
  return _allSettingsPromise;
}

// The server ships a snapshot of the DB inside the HTML, but it names the keys
// differently from the Supabase tables. Without this map the snapshot silently
// missed queue_items / portfolio_categories / calc_options, so those fell back
// to the built-in demo data and flashed it before the real rows arrived.
const SNAPSHOT_KEYS = {
  queue_items: 'queue',
  portfolio_categories: 'portfolioCategories',
  calc_options: 'calcOptions',
  prices: 'prices',
  debts: 'debts',
  links: 'links',
};
function _snapshotFor(table) {
  const snap = window.__INITIAL_DATA;
  if (!snap) return null;
  const direct = snap[table];
  if (Array.isArray(direct) && direct.length > 0) return direct;
  const alias = SNAPSHOT_KEYS[table];
  const viaAlias = alias && snap[alias];
  if (Array.isArray(viaAlias) && viaAlias.length > 0) return viaAlias;
  return null;
}

function useResource(table, defaults = [], opts = {}) {
  const orderBy = opts.orderBy || "sort_order";
  // Priority: 1) server snapshot, 2) localStorage cache, 3) defaults
  const [items, setItems] = React.useState(() => {
    // Server snapshot embedded in the HTML — real data on the very first paint
    const snap = _snapshotFor(table);
    if (snap) return snap;
    try {
      const cached = localStorage.getItem('milaria:cache:' + table);
      if (cached) {
        const parsed = JSON.parse(cached);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch(e) {}
    return Array.isArray(defaults) ? defaults : [];
  });
  const [loaded, setLoaded] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [version, setVersion] = React.useState(0);

  // Auto-cache to localStorage on every state change (skip heavy tables)
  React.useEffect(() => {
    if (opts.noCache) return;
    try { localStorage.setItem('milaria:cache:' + table, JSON.stringify(items)); } catch(e) {}
  }, [items, table]);

  React.useEffect(() => {
    let mounted = true;
    // Several sections mount at once and ask for the same table (links x3, etc.).
    // Share one in-flight request instead of firing a duplicate per component.
    _fetchTableOnce(table, orderBy, version)
      .then(({ data, error }) => {
        if (!mounted) return;
        if (error) {
          console.warn(`[${table}] load error:`, error.message);
          setError(error);
          setLoaded(true);
          return;
        }
        if (data) {
          // Always trust fresh server data (even empty) so deleted items disappear
          setItems(data);
          if (!opts.noCache) {
            try { localStorage.setItem('milaria:cache:' + table, JSON.stringify(data)); } catch(e) {}
          }
        }
        setLoaded(true);
      });
    return () => { mounted = false; };
  }, [table, version]);

  // Realtime: live sync between all connected browsers
  React.useEffect(() => {
    if (!_sbc) return;
    let channel = null;
    try {
      channel = _sbc.channel(`rt:${table}:${Math.random().toString(36).slice(2,8)}`)
        .on('postgres_changes', { event: '*', schema: 'public', table }, (payload) => {
          console.log(`[rt:${table}]`, payload.eventType, payload.new?.id || payload.old?.id);
          if (payload.eventType === 'INSERT') {
            setItems(prev => prev.some(x => x.id === payload.new.id) ? prev
              : [...prev, payload.new].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)));
          } else if (payload.eventType === 'UPDATE') {
            setItems(prev => prev.map(x => x.id === payload.new.id ? payload.new : x));
          } else if (payload.eventType === 'DELETE') {
            setItems(prev => prev.filter(x => x.id !== payload.old.id));
          }
        })
        .subscribe();
    } catch (e) { console.warn(`[rt:${table}] setup failed:`, e?.message); }
    return () => { if (channel) try { _sbc.removeChannel(channel); } catch(e) {} };
  }, [table]);

  async function add(item) {
    const payload = { ...item };
    // Keep id if explicitly provided (text-id tables like calc_options)
    // Only delete if not provided or if it's a temp placeholder
    if (!payload.id || String(payload.id).startsWith('tmp-')) delete payload.id;
    delete payload.created_at;
    delete payload.updated_at;
    if (payload.sort_order == null) {
      payload.sort_order = (items[items.length - 1]?.sort_order || 0) + 1;
    }
    // Optimistic: show item immediately with a temp id
    const tempId = 'tmp-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
    const optimistic = { ...payload, id: tempId, created_at: new Date().toISOString() };
    setItems((prev) => [...prev, optimistic]);

    if (!_sbc) return optimistic;
    try {
      const { data, error } = await _sbc.from(table).insert([payload]).select().single();
      if (error) {
        console.error(`[${table}] add:`, error.message);
        const hint = error.message.includes('does not exist') || error.code === '42P01'
          ? '\n\nТаблица ' + table + ' не найдена. Запусти SQL-скрипт.'
          : error.message.includes('violates') ? '\n\nПроверь данные — возможно дублирующийся ID.' : '';
        alert('Ошибка добавления [' + table + ']: ' + error.message + hint);
        setItems((prev) => prev.filter((x) => x.id !== tempId));
        return null;
      }
      // Replace temp with real server record
      setItems((prev) => prev.map((x) => x.id === tempId ? data : x));
      return data;
    } catch (e) {
      console.error(`[${table}] add threw:`, e?.message);
      setItems((prev) => prev.filter((x) => x.id !== tempId));
      return null;
    }
  }

  async function update(id, patch) {
    // Optimistic update - save previous state for rollback
    let prevItem = null;
    setItems((prev) => {
      prevItem = prev.find(x => x.id === id);
      return prev.map((x) => x.id === id ? { ...x, ...patch } : x);
    });
    const cleaned = { ...patch };
    delete cleaned.id;
    delete cleaned.created_at;
    delete cleaned.updated_at;
    const { data, error } = await _sbc.from(table).update(cleaned).eq("id", id).select().single();
    if (error) {
      console.error(`[${table}] update:`, error.message);
      // Rollback optimistic change
      if (prevItem) setItems(prev => prev.map(x => x.id === id ? prevItem : x));
      alert('Не удалось сохранить: ' + error.message);
      return null;
    }
    setItems((prev) => prev.map((x) => x.id === id ? data : x));
    return data;
  }

  async function remove(id) {
    const prevItems = items;
    setItems((prev) => prev.filter((x) => x.id !== id));
    if (!_sbc) return true;
    try {
      const { error } = await _sbc.from(table).delete().eq("id", id);
      if (error) {
        console.error(`[${table}] remove:`, error.message);
        setItems(prevItems);
        return false;
      }
      return true;
    } catch (e) { console.error(`[${table}] remove threw:`, e?.message); setItems(prevItems); return false; }
  }

  function refresh() { setVersion((v) => v + 1); }

  return { items, loaded, error, add, update, remove, refresh, setItems };
}

// ════════════════════════════════════════════════════════════
//  Утилиты для опций калькулятора (calc_options — плоская
//  таблица, в UI нужна вложенная структура)
// ════════════════════════════════════════════════════════════
function calcOptionsToTree(rows) {
  const tree = {};
  rows.forEach((r) => {
    if (!tree[r.category]) tree[r.category] = { labelKey: r.category, variants: {} };
    if (!tree[r.category].variants[r.variant]) {
      tree[r.category].variants[r.variant] = { ru: variantLabel(r.variant, "ru"), en: variantLabel(r.variant, "en"), base: [], addon: [] };
    }
    const opt = {
      id: r.id, ru: r.label_ru, en: r.label_en, rub: r.rub, usd: r.usd, qty: r.has_qty,
    };
    tree[r.category].variants[r.variant][r.group_type].push(opt);
  });
  // Sort children by their sort_order — we'll rely on the query order
  return tree;
}
function variantLabel(key, lang) {
  const map = {
    art:     { ru: "Только арт",     en: "Art only" },
    rig:     { ru: "Арт + риг",      en: "Art + Live2D rig" },
    basic:   { ru: "PNG",            en: "PNG" },
    plus:    { ru: "PNG+",           en: "PNG+" },
    default: { ru: "Иллюстрация",    en: "Illustration" },
  };
  return map[key]?.[lang] || key;
}

// ════════════════════════════════════════════════════════════
//  Seed — загрузить дефолтные данные в БД (один раз, после
//  первого логина если таблицы пустые)
// ════════════════════════════════════════════════════════════
// ── Image upload: resize + base64 (stored directly in DB, no Storage needed) ──
// ── useSetting: single key-value config (syncs via Realtime to all users) ──
function useSetting(key, defaultValue) {
  const [value, setValue] = React.useState(() => {
    // localStorage first — it holds the freshest value THIS browser saw/saved
    // (avoids flicker when the server snapshot lags behind a just-made change)
    try {
      const cached = localStorage.getItem('milaria:setting:' + key);
      if (cached !== null) return JSON.parse(cached);
    } catch(e) {}
    if (window.__INITIAL_SETTINGS?.[key] !== undefined) return window.__INITIAL_SETTINGS[key];
    return defaultValue;
  });
  const [loaded, setLoaded] = React.useState(false);

  // Cache settings whenever they change
  React.useEffect(() => {
    try { localStorage.setItem('milaria:setting:' + key, JSON.stringify(value)); } catch(e) {}
  }, [key, value]);

  React.useEffect(() => {
    if (!_sbc) { setLoaded(true); return; }
    let mounted = true;

    // Batched: one request covers every key on the page (was 1 request per key)
    _fetchAllSettings()
      .then((all) => {
        if (!mounted) return;
        const data = (all && all[key] !== undefined) ? { value: all[key] } : null;
        // Only update if the server value actually differs (prevents needless re-render/flicker)
        if (data && data.value !== undefined && data.value !== null) {
          setValue(prev => {
            try { if (JSON.stringify(prev) === JSON.stringify(data.value)) return prev; } catch(e) {}
            return data.value;
          });
        }
        setLoaded(true);
      }).catch(() => setLoaded(true));

    let channel = null;
    try {
      channel = _sbc.channel(`rt:setting:${key}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'settings', filter: `key=eq.${key}` }, (payload) => {
          if (payload.new?.value) setValue(payload.new.value);
        })
        .subscribe();
    } catch(e) {}

    return () => { mounted = false; if (channel) try { _sbc.removeChannel(channel); } catch(e){} };
  }, [key]);

  async function save(newValue) {
    setValue(newValue); // optimistic
    if (!_sbc) return;
    try {
      await _sbc.from('settings').upsert({ key, value: newValue }, { onConflict: 'key' });
    } catch (e) { console.warn('[setting]', key, e?.message); }
  }

  return [value, save, loaded];
}

// ── Supabase Storage upload (proper: file + CDN, not base64) ──
const STORAGE_BUCKET = 'portfolio';

// What kind of media is this file? GIF/video must NOT go through canvas.
function fileKind(file) {
  const type = (file.type || '').toLowerCase();
  const ext = ((file.name || '').toLowerCase().match(/\.(\w+)$/) || [])[1] || '';
  if (type === 'image/gif' || ext === 'gif') return 'gif';
  if (type.indexOf('video/') === 0 || ['mp4','webm','mov','m4v'].indexOf(ext) !== -1) return 'video';
  return 'image';
}

// Can this browser ENCODE webp? Checked once and reused.
// toBlob() silently falls back to png for unsupported types instead of failing,
// so a data-url probe is the only reliable way to ask.
let _webpOK = null;
function canEncodeWebp() {
  if (_webpOK !== null) return _webpOK;
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 1;
    _webpOK = c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  } catch (e) { _webpOK = false; }
  return _webpOK;
}

// Resize a File/Blob and encode it. WebP where supported (same quality at
// roughly half the bytes), JPEG otherwise. Portfolio images are the product
// here, so this is the one place worth not cutting corners.
// Resolves { blob, mime, ext } — or null if the picture could not be read.
function resizeToBlob(file, maxW, quality) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const webp = canEncodeWebp();
        const mime = webp ? 'image/webp' : 'image/jpeg';
        canvas.toBlob(
          b => resolve(b ? { blob: b, mime, ext: webp ? 'webp' : 'jpg' } : null),
          mime, quality
        );
      };
      img.onerror = () => resolve(null);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

function storagePublicUrl(path) {
  const { data } = _sbc.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  // Rewrite to proxied path so it loads through our server (DPI-safe)
  return data.publicUrl.replace(SUPABASE_URL, '/supa');
}

// Returns { url, thumb } of proxied public URLs, or null on failure
async function uploadToStorage(file) {
  try {
    const kind = fileKind(file);

    // GIF / video: upload the ORIGINAL bytes.
    // Canvas would flatten a GIF to its first frame and cannot read video at all.
    if (kind === 'gif' || kind === 'video') {
      if (file.size > 45 * 1024 * 1024) {
        alert('Файл слишком большой (' + Math.round(file.size / 1048576) + ' МБ). Максимум ~45 МБ.');
        return null;
      }
      const ext = kind === 'gif'
        ? 'gif'
        : (((file.name || '').toLowerCase().match(/\.(\w+)$/) || [])[1] || 'mp4');
      const base = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const path = `full/${base}.${ext}`;
      const contentType = kind === 'gif' ? 'image/gif' : (file.type || 'video/mp4');
      const up = await _sbc.storage.from(STORAGE_BUCKET).upload(path, file, { contentType, upsert: false });
      if (up.error) {
        console.error('[storage] upload failed', up.error);
        alert('Не удалось загрузить в хранилище.\nПроверь что создан публичный bucket "portfolio" в Supabase Storage.');
        return null;
      }
      const url = storagePublicUrl(path);
      return { url, thumb: url }; // animated GIF stays animated everywhere
    }

    const full = await resizeToBlob(file, 1600, 0.85);   // full view
    const thumb = await resizeToBlob(file, 500, 0.78);    // grid thumbnail
    if (!full) { alert('Не удалось обработать картинку'); return null; }
    const base = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const fullPath = `full/${base}.${full.ext}`;
    const thumbPath = thumb ? `thumb/${base}.${thumb.ext}` : null;

    const up1 = await _sbc.storage.from(STORAGE_BUCKET).upload(fullPath, full.blob, { contentType: full.mime, upsert: false });
    if (up1.error) {
      console.error('[storage] full upload failed', up1.error);
      alert('Не удалось загрузить в хранилище.\nПроверь что создан публичный bucket "portfolio" в Supabase Storage.');
      return null;
    }
    let thumbUrl = null;
    if (thumb) {
      const up2 = await _sbc.storage.from(STORAGE_BUCKET).upload(thumbPath, thumb.blob, { contentType: thumb.mime, upsert: false });
      if (!up2.error) thumbUrl = storagePublicUrl(thumbPath);
    }
    const url = storagePublicUrl(fullPath);
    return { url, thumb: thumbUrl || url };
  } catch (e) {
    console.error('[storage] error', e);
    return null;
  }
}

async function uploadImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        // Resize to max 1200px — high quality for portfolio
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        console.log('[upload] image:', w, 'x', h, '—', Math.round(dataUrl.length / 1024), 'KB');
        resolve(dataUrl);
      };
      img.onerror = function() { alert('Ошибка загрузки картинки'); resolve(null); };
      img.src = e.target.result;
    };
    reader.onerror = function() { alert('Ошибка чтения файла'); resolve(null); };
    reader.readAsDataURL(file);
  });
}

async function seedDefaults() {
  const report = [];

  // queue_items — deliberately NOT seeded.
  // The queue holds real client orders; there is no meaningful demo content for
  // it, and wiping it here would destroy live data.

  // portfolio_categories
  const portfolioRows = [
    ...DEFAULT_PORTFOLIO.models.map((m, i) => ({ key: m.key, kind: "model", count: m.count, hue: m.hue, sort_order: i })),
    ...DEFAULT_PORTFOLIO.illustrations.map((m, i) => ({ key: m.key, kind: "illustration", count: m.count, hue: m.hue, sort_order: i })),
  ];
  await wipe("portfolio_categories"); report.push(await bulkInsert("portfolio_categories", portfolioRows));

  // prices
  const priceRows = DEFAULT_PRICES.map((p, i) => ({ label: p.key, rub: p.rub, sort_order: i }));
  await wipe("prices"); report.push(await bulkInsert("prices", priceRows));

  // calc_options — flatten the nested tree
  const calcRows = [];
  Object.entries(DEFAULT_CALC).forEach(([cat, catObj]) => {
    Object.entries(catObj.variants).forEach(([variant, varObj]) => {
      ["base", "addon"].forEach((group) => {
        (varObj[group] || []).forEach((opt, i) => {
          calcRows.push({
            id: opt.id, category: cat, variant, group_type: group,
            label_ru: opt.ru, label_en: opt.en, rub: opt.rub, has_qty: !!opt.qty,
            sort_order: i,
          });
        });
      });
    });
  });
  await wipe("calc_options"); report.push(await bulkInsert("calc_options", calcRows));

  // debts
  const debtRows = DEFAULT_DEBTS.map((d, i) => ({
    title: d.title, stream_date: d.stream, reason: d.reason, status: d.status, progress: d.progress, sort_order: i,
  }));
  await wipe("debts"); report.push(await bulkInsert("debts", debtRows));

  // links
  const linkRows = DEFAULT_LINKS.map((l, i) => ({
    label: l.label, handle: l.handle, url: l.url, kind: l.kind, sort_order: i,
  }));
  await wipe("links"); report.push(await bulkInsert("links", linkRows));

  return report;
}

// Race a Supabase operation against a 15s timeout so the seed UI can't
// hang forever on a stuck network.
function _withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error(label + ' timed out after ' + ms + 'ms')), ms)),
  ]);
}
async function wipe(table) {
  if (!_sbc) return;
  try { await _withTimeout(_sbc.from(table).delete().neq("id", "00000000-0000-0000-0000-000000000000"), 15000, `wipe ${table}`); }
  catch (e) { console.warn(`[${table}] wipe failed:`, e?.message); }
}
async function bulkInsert(table, rows) {
  if (rows.length === 0) return { table, count: 0 };
  if (!_sbc) return { table, error: 'no Supabase client' };
  try {
    const { error } = await _withTimeout(_sbc.from(table).insert(rows), 15000, `insert ${table}`);
    if (error) { console.error(`[${table}] seed:`, error.message); return { table, error: error.message }; }
    return { table, count: rows.length };
  } catch (e) { return { table, error: e?.message || 'threw' }; }
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>

function ImageUploader({ onUpload, label, multiple }) {
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);

  async function handleFiles(e) {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    setBusy(true);
    const urls = [];
    for (const file of files) {
      const url = await window.uploadImage(file);
      if (url) urls.push(url);
    }
    setBusy(false);
    if (urls.length > 0) onUpload(multiple ? urls : urls[0]);
    if (inputRef.current) inputRef.current.value = '';
  }

  return (
    <button className="upload-btn" onClick={() => inputRef.current?.click()} disabled={busy}>
      <input ref={inputRef} type="file" accept="image/*" multiple={multiple}
        style={{ display: 'none' }} onChange={handleFiles} />

  );

// ─── Drag-to-reorder hook ───
function useDragReorder(items, resource) {
  const [dragId, setDragId] = useState(null);
  const [overId, setOverId] = useState(null);

  function getHandlers(item) {
    return {
      draggable: true,
      onDragStart: (e) => {
        setDragId(item.id);
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', item.id); } catch (err) {}
      },
      onDragOver: (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (overId !== item.id) setOverId(item.id); },
      onDragLeave: () => { if (overId === item.id) setOverId(null); },
      onDrop: (e) => {
        e.preventDefault();
        const fromId = dragId;
        setDragId(null); setOverId(null);
        if (fromId == null || fromId === item.id) return;
        const ordered = [...items];
        const from = ordered.findIndex(i => i.id === fromId);
        const to = ordered.findIndex(i => i.id === item.id);
        if (from < 0 || to < 0) return;
        const [moved] = ordered.splice(from, 1);
        ordered.splice(to, 0, moved);
        // Optimistic local update + persist sort_order
        if (resource.setItems) {
          resource.setItems(prev => {
            const map = {};
            ordered.forEach((it, idx) => { map[it.id] = idx; });
            return [...prev].sort((a, b) => (map[a.id] ?? 0) - (map[b.id] ?? 0));
          });
        }
        ordered.forEach((it, idx) => {
          if (it.sort_order !== idx) resource.update(it.id, { sort_order: idx });
        });
      },
      onDragEnd: () => { setDragId(null); setOverId(null); },
      className: `${dragId === item.id ? 'dragging' : ''} ${overId === item.id && dragId !== item.id ? 'drag-over' : ''}`,
    };
  }
  return { getHandlers, dragId, overId };
}

function EditItemModal({ open, onClose, onSave, fields, values, title, lang }) {
  const [draft, setDraft] = useState({});

  useEffect(() => {
    if (open) {
      const init = {};
      fields.forEach(f => {
        init[f.key] = values ? (values[f.key] ?? f.default ?? '') : (f.default ?? '');
      });

  }, [open]);

  function handleSave() {
    onSave({ ...draft });

  }

  if (!open) return null;

  return (
    <Modal open={true} onClose={onClose}>
      <div style={{ maxWidth: 480, minWidth: 320 }}>

          ✦ {values ? (lang === 'ru' ? 'редактировать' : 'edit') : (lang === 'ru' ? 'добавить' : 'add')}
        </div>
        <h2 style={{ fontFamily: 'var(--font-display)', fontStyle: 'italic', fontSize: 32, margin: '0 0 20px', fontWeight: 500 }}>
          {title}
        </h2>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          {fields.map(f => (
            <label key={f.key} className="login-field">
              <span>{f.label}</span>
              {f.type === 'select' ? (
                <select
                  value={draft[f.key] || ''}
                  onChange={e => setDraft(prev => ({...prev, [f.key]: e.target.value}))}
                  style={{ padding: '10px 14px', borderRadius: 'var(--r)', background: 'rgba(40,34,28,0.98)', border: '1px solid rgba(255,255,255,0.08)', color: 'var(--text)', fontFamily: 'var(--font-body)', fontSize: 14 }}>
                  {f.options.map(o => <option key={o.value} value={o.value} style={{ background: '#23201b', color: '#f0e9df' }}>{o.label}</option>)}
                </select>
              ) : f.type === 'image' ? (
                <div>
                  {draft[f.key] && (
                    <div style={{ marginBottom: 8, position: 'relative', display: 'inline-block' }}>
                      <img src={draft[f.key]} style={{ maxWidth: 120, maxHeight: 90, borderRadius: 8, objectFit: 'cover' }} alt="" />
                      <button className="admin-btn danger" style={{ position: 'absolute', top: 4, right: 4, width: 22, height: 22, fontSize: 12 }}
                        onClick={() => setDraft(prev => ({ ...prev, [f.key]: '' }))}>×</button>
                    </div>
                  )}
                  <div style={{ display: 'flex', gap: 6 }}>
                    <input type="text" value={draft[f.key] || ''} placeholder="URL картинки..."
                      onChange={e => setDraft(prev => ({ ...prev, [f.key]: e.target.value }))}
                      style={{ flex: 1 }} />
                    <ImageUploader label="📷" onUpload={url => setDraft(prev => ({ ...prev, [f.key]: url }))} />
                  </div>
                </div>
              ) : f.type === 'textarea' ? (
                <textarea
                  value={draft[f.key] || ''}
                  rows={3}
                  onChange={e => setDraft(prev => ({...prev, [f.key]: e.target.value}))}
                  style={{ padding: '10px 14px', borderRadius: 'var(--r)', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', color: 'var(--text)', fontFamily: 'var(--font-body)', fontSize: 14, resize: 'vertical' }}
                />
              ) : (
                <input
                  type={f.type || 'text'}
                  value={draft[f.key] ?? ''}
                  min={f.min}
                  max={f.max}
                  required={f.required}
                  placeholder={f.placeholder || ''}
                  onChange={e => {
                    const val = f.type === 'number' ? (parseInt(e.target.value) || 0) : e.target.value;
                    setDraft(prev => ({...prev, [f.key]: val}));
                  }}
                />
              )}
            </label>
          ))}
          <button className="btn btn-primary" onClick={handleSave} style={{ marginTop: 8, justifyContent: 'center' }}>
            {values
              ? (lang === 'ru' ? 'Сохранить' : 'Save')
              : (lang === 'ru' ? 'Добавить' : 'Add')}
          </button>
        </div>
      </div>
    </Modal>
  );
}
