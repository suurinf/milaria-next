// ─── Recent Works: 4 editable tiles, each with multiple image slots ───
const DEFAULT_TILES = [
  { label: 'АРТ', label_en: 'ART', hue: 320, color: 'blue', slots: [] },
  { label: 'СКЕТЧ', label_en: 'SKETCH', hue: 200, color: 'violet', slots: [] },
  { label: 'МОДЕЛЬ 2D', label_en: 'MODEL 2D', hue: 280, color: 'red', slots: [] },
  { label: 'РИГ', label_en: 'RIG', hue: 0, color: 'amber', slots: [] },
];

// ── Media type detection (handles query params in Storage URLs) ──
function detectMedia(url) {
  if (!url) return 'image';
  const clean = url.split('?')[0].toLowerCase();
  if (clean.includes('youtube.com') || clean.includes('youtu.be')) return 'youtube';
  if (/\.(mp4|webm|mov|m4v)$/.test(clean)) return 'video';
  if (/\.gif$/.test(clean)) return 'gif';
  return 'image';
}
function ytIdFrom(url) {
  return (String(url).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]+)/) || [])[1];
}

// ── Focal point picker: click image → sets center point ──
// ── Focal point picker: drag the frame, preview = exactly what the tile shows ──
function FocalPicker({ src, focal, onChange }) {
  function parseFocal(f) {
    if (!f) return { x: 50, y: 50 };
    const p = String(f).replace(/%/g, '').trim().split(/\s+/);
    const x = parseFloat(p[0]), y = parseFloat(p[1]);
    return { x: isNaN(x) ? 50 : x, y: isNaN(y) ? 50 : y };
  }

  const [pos, setPos] = homeState(() => parseFocal(focal));
  const [ratio, setRatio] = homeState(0.487);      // tile w/h — measured from the real tile
  const [imgRatio, setImgRatio] = homeState(null); // natural w/h of the picture

  const imgWrapRef = homeRef(null);
  const frameRef = homeRef(null);
  const previewRef = homeRef(null);
  const posRef = homeRef(pos);
  const draggingRef = homeRef(false);

  // Measure the real tile on screen so the preview matches 1:1
  homeEffect(() => {
    const tile = document.querySelector('.recent-tile');
    if (tile) {
      const r = tile.getBoundingClientRect();
      if (r.width > 0 && r.height > 0) setRatio(r.width / r.height);
    }
  }, []);

  // The crop rectangle the tile actually shows, in % of the image (background-size:cover math)
  function cropBox() {
    if (!imgRatio) return { w: 45, h: 92 };
    if (imgRatio > ratio) {
      // image wider than tile → full height used, width cropped
      return { w: (ratio / imgRatio) * 100, h: 100 };
    }
    // image taller than tile → full width used, height cropped
    return { w: 100, h: (imgRatio / ratio) * 100 };
  }

  // Paint frame + preview straight to the DOM (no React re-render → no lag)
  function paint(x, y) {
    const box = cropBox();
    const left = Math.max(0, Math.min(100 - box.w, x - box.w / 2));
    const top = Math.max(0, Math.min(100 - box.h, y - box.h / 2));
    if (frameRef.current) {
      frameRef.current.style.left = left + '%';
      frameRef.current.style.top = top + '%';
      frameRef.current.style.width = box.w + '%';
      frameRef.current.style.height = box.h + '%';
    }
    if (previewRef.current) previewRef.current.style.backgroundPosition = x + '% ' + y + '%';
  }

  homeEffect(() => { paint(pos.x, pos.y); }, [imgRatio, ratio]);

  function pointFromEvent(e) {
    const el = imgWrapRef.current;
    if (!el) return null;
    const r = el.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {
      x: Math.max(0, Math.min(100, (src.clientX - r.left) / r.width * 100)),
      y: Math.max(0, Math.min(100, (src.clientY - r.top) / r.height * 100)),
    };
  }

  function moveTo(e) {
    const p = pointFromEvent(e);
    if (!p) return;
    posRef.current = p;
    paint(p.x, p.y); // instant, DOM-only
  }

  function commit() {
    if (!draggingRef.current) return;
    draggingRef.current = false;
    const p = posRef.current;
    const x = Math.round(p.x), y = Math.round(p.y);
    setPos({ x, y });        // one re-render at the very end
    onChange(x + '% ' + y + '%');
  }

  function onDown(e) {
    draggingRef.current = true;
    moveTo(e);
    e.preventDefault();
  }

  // Track drag beyond the image bounds too
  homeEffect(() => {
    function onMove(e) { if (draggingRef.current) moveTo(e); }
    function onUp() { commit(); }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onUp);
    };
  }, [imgRatio, ratio]);

  const box = cropBox();
  const initLeft = Math.max(0, Math.min(100 - box.w, pos.x - box.w / 2));
  const initTop = Math.max(0, Math.min(100 - box.h, pos.y - box.h / 2));

  return (
    <div style={{ marginTop: 8 }}>
      <div style={{ fontSize: 11, color: 'var(--accent)', fontFamily: 'var(--font-mono)', marginBottom: 6 }}>
        Перетащи рамку — справа видно как будет в плашке
      </div>
      <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
        {/* Image with draggable crop frame */}
        <div ref={imgWrapRef}
          style={{ flex: '1 1 0', position: 'relative', borderRadius: 8, overflow: 'hidden',
                   cursor: 'grab', lineHeight: 0, userSelect: 'none', touchAction: 'none' }}
          onMouseDown={onDown} onTouchStart={onDown}>
          <img src={src} alt=""
            onLoad={e => {
              const n = e.target;
              if (n.naturalWidth && n.naturalHeight) setImgRatio(n.naturalWidth / n.naturalHeight);
            }}
            style={{ width: '100%', display: 'block', maxHeight: 190, objectFit: 'contain', background: '#111' }} />
          {/* Crop frame — dark outside, clear inside */}
          <div ref={frameRef} style={{
            position: 'absolute',
            left: initLeft + '%', top: initTop + '%',
            width: box.w + '%', height: box.h + '%',
            border: '2px solid var(--accent)',
            borderRadius: 4, pointerEvents: 'none',
            boxShadow: '0 0 0 9999px rgba(0,0,0,0.55)',
          }} />
        </div>

        {/* Live preview — identical CSS to the real tile */}
        <div style={{ flex: '0 0 auto', display: 'flex', flexDirection: 'column', gap: 5, alignItems: 'center' }}>
          <span style={{ fontSize: 10, color: 'var(--text-dim)', fontFamily: 'var(--font-mono)' }}>в плашке</span>
          <div ref={previewRef} style={{
            width: Math.round(190 * ratio), height: 190,
            borderRadius: 14, border: '1px solid var(--line)',
            backgroundImage: 'url(' + src + ')',
            backgroundSize: 'cover',
            backgroundPosition: pos.x + '% ' + pos.y + '%',
            backgroundColor: '#111',
          }} />
          <button className="admin-btn" style={{ fontSize: 10 }}
            onClick={() => { posRef.current = { x: 50, y: 50 }; paint(50, 50); setPos({ x: 50, y: 50 }); onChange('50% 50%'); }}>
            ⟳ по центру
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Single media layer inside tile ──
function TileMediaLayer({ src, focal, active, hovering }) {
  const type = detectMedia(src);
  const vidRef = homeRef(null);
  const focalStr = focal || '50% 50%';

  homeEffect(() => {
    if (!vidRef.current) return;
    // No hover on touch — play whichever slot is currently shown.
    if (active && (hovering || IS_TOUCH)) {
      vidRef.current.play().catch(() => {});
    } else {
      vidRef.current.pause();
    }
  }, [hovering, active]);

  if (type === 'youtube') {
    const id = ytIdFrom(src);
    return (
      <div style={{
        position: 'absolute', inset: 0, opacity: active ? 1 : 0,
        transition: 'opacity 0.5s ease',
        backgroundImage: id ? `url(https://img.youtube.com/vi/${id}/hqdefault.jpg)` : 'none',
        backgroundSize: 'cover', backgroundPosition: focalStr,
      }} />
    );
  }
  if (type === 'video') {
    return (
      <div style={{
        position: 'absolute', inset: 0, opacity: active ? 1 : 0,
        transition: 'opacity 0.5s ease', overflow: 'hidden',
      }}>
        <video ref={vidRef} src={src} loop muted playsInline preload="metadata"
          style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition: focalStr }}
        />
      </div>
    );
  }
  // image or gif — both work as background-image (GIF animates natively)
  return (
    <div style={{
      position: 'absolute', inset: 0, opacity: active ? 1 : 0,
      transition: 'opacity 0.5s ease',
      backgroundImage: `url(${src})`, backgroundSize: 'cover',
      backgroundPosition: focalStr,
    }} />
  );
}

// Touch devices have no hover, so anything gated behind it is dead there.
const IS_TOUCH = typeof window !== 'undefined' &&
  window.matchMedia && window.matchMedia('(hover: none)').matches;

function RecentTile({ tileData, lang, onClick }) {
  const slots = (tileData.slots || []).filter(Boolean);
  const focal = tileData.focal || [];
  const count = slots.length;
  const [idx, setIdx] = homeState(0);
  const [hovering, setHovering] = homeState(false);
  const intRef = homeRef(null);
  const touchRef = homeRef(null);
  const swipedRef = homeRef(false);

  homeEffect(() => {
    // Auto-cycling is a hover affordance. On touch the user drives it by
    // swiping, so don't spin images under their finger.
    if (hovering && !IS_TOUCH && count > 1) {
      intRef.current = setInterval(() => setIdx(i => (i + 1) % count), 3000);
    } else {
      clearInterval(intRef.current);
    }
    return () => clearInterval(intRef.current);
  }, [hovering, count]);

  const go = (dir) => setIdx(i => (i + dir + count) % count);

  function onTouchStart(e) {
    const t = e.touches[0];
    touchRef.current = { x: t.clientX, y: t.clientY };
    swipedRef.current = false;
  }
  function onTouchMove(e) {
    if (!touchRef.current || count < 2) return;
    const t = e.touches[0];
    const dx = t.clientX - touchRef.current.x;
    const dy = t.clientY - touchRef.current.y;
    // Only claim the gesture once it's clearly horizontal — otherwise the page
    // must stay scrollable through the tile.
    if (Math.abs(dx) > 34 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      go(dx < 0 ? 1 : -1);
      swipedRef.current = true;
      touchRef.current = null;
    }
  }
  function onTouchEnd() { touchRef.current = null; }

  const label = lang === 'en' ? (tileData.label_en || tileData.label) : tileData.label;

  return (
    <div className="recent-tile" data-color={tileData.color}
      style={{ '--hue': tileData.hue }}
      onMouseEnter={() => setHovering(true)}
      onMouseLeave={() => setHovering(false)}
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
      onClick={() => { if (swipedRef.current) { swipedRef.current = false; return; } onClick(); }}>
      <div className="recent-tile-imgs">
        {/* Gradient placeholder underneath */}
        <div style={{
          position: 'absolute', inset: 0,
          backgroundImage: `linear-gradient(135deg, hsl(${tileData.hue} 55% 45%), hsl(${tileData.hue + 30} 35% 22%))`,
          opacity: slots.length ? 0 : 1,
        }} />
        {slots.map((src, i) => (
          <TileMediaLayer key={i} src={src} focal={focal[i]} active={i === idx} hovering={hovering} />
        ))}
      </div>
      {count > 1 && (
        <>
          <button className="rtile-arr rtile-arr-l" aria-label="Предыдущая работа"
            onTouchStart={e => e.stopPropagation()}
            onClick={e => { e.stopPropagation(); go(-1); }}>‹</button>
          <button className="rtile-arr rtile-arr-r" aria-label="Следующая работа"
            onTouchStart={e => e.stopPropagation()}
            onClick={e => { e.stopPropagation(); go(1); }}>›</button>
          <div className="recent-tile-counter">
            {slots.map((_, i) => <span key={i} className={i === idx ? 'on' : ''} />)}
          </div>
        </>
      )}
      <div className="recent-tile-vlabel">{label}</div>
      <div className="recent-tile-arrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </div>
    </div>
  );
}

function RecentTileEditor({ tile, onSave, onClose, lang }) {
  const [draft, setDraft] = homeState(() => ({
    ...tile,
    slots: [...(tile.slots || [])],
    focal: [...(tile.focal || [])],
  }));
  const [urlInput, setUrlInput] = homeState('');
  const [focalSlot, setFocalSlot] = homeState(null); // index of slot being edited
  const fileRef = homeRef(null);

  // Autosave: keep refs fresh so a flush never writes with a stale closure
  const draftRef = homeRef(draft);   draftRef.current = draft;
  const onSaveRef = homeRef(onSave); onSaveRef.current = onSave;
  const firstRef = homeRef(true);
  const dirtyRef = homeRef(false);

  homeEffect(() => {
    if (firstRef.current) { firstRef.current = false; return; }
    dirtyRef.current = true;
    const t = setTimeout(() => { onSaveRef.current(draftRef.current); dirtyRef.current = false; }, 500);
    return () => clearTimeout(t);
  }, [draft]);

  // Flush pending changes when switching tabs / closing
  homeEffect(() => () => {
    if (dirtyRef.current) onSaveRef.current(draftRef.current);
  }, []);

  function addUrl() {
    if (!urlInput.trim()) return;
    setDraft(d => ({ ...d, slots: [...d.slots, urlInput.trim()], focal: [...(d.focal || []), '50% 50%'] }));
    setUrlInput('');
  }
  function removeSlot(i) {
    setDraft(d => {
      const slots = d.slots.filter((_, j) => j !== i);
      const focal = (d.focal || []).filter((_, j) => j !== i);
      return { ...d, slots, focal };
    });
    if (focalSlot === i) setFocalSlot(null);
  }
  function setFocal(i, val) {
    setDraft(d => {
      const focal = [...(d.focal || d.slots.map(() => '50% 50%'))];
      focal[i] = val;
      return { ...d, focal };
    });
  }
  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const up = await window.uploadToStorage(file);
    if (up) {
      setDraft(d => ({ ...d, slots: [...d.slots, up.url], focal: [...(d.focal || []), '50% 50%'] }));
    }
    if (fileRef.current) fileRef.current.value = '';
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <label className="login-field">
          <span>Название (RU)</span>
          <input value={draft.label || ''} onChange={e => setDraft(d => ({ ...d, label: e.target.value }))} />
        </label>
        <label className="login-field">
          <span>Label (EN)</span>
          <input value={draft.label_en || ''} onChange={e => setDraft(d => ({ ...d, label_en: e.target.value }))} />
        </label>

        <div>
          <span style={{ display: 'block', fontSize: 12, color: 'var(--text-dim)', marginBottom: 8, fontFamily: 'var(--font-mono)' }}>
            {lang === 'ru' ? 'Медиафайлы — картинки, видео (mp4), гиф' : 'Media — images, video (mp4), gif'}
          </span>

          {/* Slot list */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 8 }}>
            {(draft.slots || []).map((s, i) => {
              const type = detectMedia(s);
              const focal = (draft.focal || [])[i] || '50% 50%';
              const isEditing = focalSlot === i;
              return (
                <div key={i} style={{ background: 'rgba(255,255,255,0.03)', borderRadius: 8, padding: 8 }}>
                  <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                    {type === 'video' ? (
                      <div style={{ width: 48, height: 36, borderRadius: 4, background: '#111', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                        <span style={{ fontSize: 18 }}>🎬</span>
                      </div>
                    ) : type === 'gif' ? (
                      <img src={s} style={{ width: 48, height: 36, objectFit: 'cover', borderRadius: 4 }} alt="" />
                    ) : (
                      <img src={s} style={{ width: 48, height: 36, objectFit: 'cover', borderRadius: 4 }} alt=""
                        onError={e => e.target.style.display='none'} />
                    )}
                    <span style={{ flex: 1, fontSize: 11, color: 'var(--text-dim)', fontFamily: 'var(--font-mono)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {type === 'video' ? '🎬 ' : type === 'gif' ? '🎞 ' : ''}{s.split('/').pop().split('?')[0]}
                    </span>
                    {type !== 'video' && (
                      <button className="admin-btn" style={{ fontSize: 11, whiteSpace: 'nowrap' }}
                        onClick={() => setFocalSlot(isEditing ? null : i)}
                        title="Выбрать кадр">
                        {isEditing ? '✓' : '🎯'}
                      </button>
                    )}
                    <button className="admin-btn danger" style={{ width: 24, height: 24, fontSize: 11, flexShrink: 0 }}
                      onClick={() => removeSlot(i)}>×</button>
                  </div>
                  {/* Focal picker expanded */}
                  {isEditing && type !== 'video' && (
                    <FocalPicker src={s} focal={focal}
                      onChange={val => setFocal(i, val)} />
                  )}
                </div>
              );
            })}
          </div>

          {/* Add URL */}
          <label className="login-field">
            <span>+ {lang === 'ru' ? 'URL (картинка / mp4 / youtube)' : 'URL (image / mp4 / youtube)'}</span>
            <div style={{ display: 'flex', gap: 6 }}>
              <input value={urlInput} onChange={e => setUrlInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && addUrl()}
                placeholder="https://..." style={{ flex: 1 }} />
              <button className="btn btn-primary" style={{ fontSize: 12, padding: '6px 14px', flexShrink: 0 }} onClick={addUrl}>+</button>
            </div>
          </label>

          {/* Upload file */}
          <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
            <button className="btn" style={{ fontSize: 12 }} onClick={() => fileRef.current?.click()}>
              📷 {lang === 'ru' ? 'Загрузить файл' : 'Upload file'}
            </button>
            <input ref={fileRef} type="file" accept="image/*,video/mp4,video/webm" style={{ display: 'none' }} onChange={handleFile} />
          </div>
        </div>

        <button className="btn btn-primary" style={{ marginTop: 6, justifyContent: 'center' }}
          onClick={() => { onSaveRef.current(draftRef.current); dirtyRef.current = false; onClose(); }}>
          {lang === 'ru' ? 'Готово' : 'Done'}
        </button>
    </div>
  );
}

// Format deadline range: "12.05 → 12.06.2026" or single date
function fmtDeadline(start, end) {
  const fmt = (d) => {
    if (!d) return '';
    const date = new Date(d);
    if (isNaN(date)) return d;
    return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
  };
  if (start && end) return `${fmt(start)} → ${fmt(end)}`;
  if (end) return `→ ${fmt(end)}`;
  if (start) return `${fmt(start)} →`;
  return '';
}

}

// ───── card layout ─────
function QueueCard({ item, idx, t }) {
  return (
    <div className="q-card">
      {item.tag && <span className={`q-tag ${item.tag}`}>{t.queue[item.tag]}</span>}
      <div className="q-card-head">
        <span className="q-card-num">{String(idx + 1).padStart(2, '0')}</span>
      </div>
      <div className="q-card-title">{item.title}</div>
      <div className="q-card-bar">
        <span style={{ width: `${item.progress}%` }}></span>
      </div>
      <div className="q-card-foot">
        <span>{t.queue.progress}</span>
        <span style={{ color: 'var(--accent)' }}>{item.progress}%</span>
      </div>
    </div>
  );
}

// ───── timeline layout ─────
function QueueTimeItem({ item, idx, t, done }) {
  return (
    <div className={`q-time-item ${done ? 'done' : ''}`}>
      <div>
        <div className="q-time-num">№ {String(idx + 1).padStart(2, '0')}{item.date ? ` · ${item.date}` : ''}</div>
        <div className="q-time-title">{item.title}</div>
        {!done && (
          <div className="q-time-bar">
            <span style={{ width: `${item.progress}%` }}></span>
          </div>
        )}
      </div>
      <div className="q-time-pct">{done ? '✓' : `${item.progress}%`}</div>
    </div>
  );
}

// ───── main section ─────
function QueueSection({ t, lang, admin, layout, barStyle }) {
  // Defaults blend in-progress and completed into one array with `kind`
  const queueDefaults = React.useMemo(() => [
    ...DEFAULT_QUEUE_IN_PROGRESS.map((q, i) => ({ ...q, kind: 'in_progress', sort_order: i })),
    ...DEFAULT_QUEUE_COMPLETED.map((q, i) => ({ ...q, kind: 'completed', completed_date: q.date === '—' ? null : q.date, sort_order: 100 + i })),
  ], []);
  const queue = useResource('queue_items', queueDefaults);
  const dragInProgress = useDragReorder(
    (queue.items || []).filter(i => i.kind === 'in_progress'),
    queue
  );
  const dragCompleted = useDragReorder(
    (queue.items || []).filter(i => i.kind === 'completed'),
    queue
  );
  const inProgress = React.useMemo(() => queue.items.filter(x => x.kind === 'in_progress'), [queue.items]);
  const completed = React.useMemo(
    () => queue.items.filter(x => x.kind === 'completed').map(x => ({ ...x, date: x.completed_date || '—' })),
    [queue.items]
  );

  const [query, setQuery] = qState('');
  const [filter, setFilter] = qState('all');
  const [sort, setSort]   = qState('progress');

  // Animate progress on mount: start from 0
  const [animated, setAnimated] = qState(false);
  qEffect(() => {
    const id = requestAnimationFrame(() => setAnimated(true));
    return () => cancelAnimationFrame(id);
  }, []);

  const filteredInProgress = qMemo(() => {
    let arr = [...inProgress];
    if (query) arr = arr.filter(x => x.title.toLowerCase().includes(query.toLowerCase()));
    if (filter !== 'all') arr = arr.filter(x => x.tag === filter);
    if (sort === 'progress') arr.sort((a, b) => b.progress - a.progress);
    return arr;
  }, [inProgress, query, filter, sort]);

  const filteredCompleted = qMemo(() => {
    let arr = [...completed];
    if (query) arr = arr.filter(x => x.title.toLowerCase().includes(query.toLowerCase()));
    if (filter !== 'all') arr = arr.filter(x => x.tag === filter);
    if (sort === 'new') arr.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    else if (sort === 'old') arr.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    return arr;
  }, [completed, query, filter, sort]);

  function updateInProgress(updated) {
    queue.update(updated.id, { title: updated.title, progress: updated.progress, tag: updated.tag });
  }
  function deleteInProgress(id) {
    queue.remove(id);
  }
  const [editModal, setEditModal] = qState(null);

  const queueFields = qMemo(() => [
    { key: 'title', label: lang === 'ru' ? 'Название' : 'Title', type: 'text', required: true, default: '' },
    { key: 'progress', label: lang === 'ru' ? 'Прогресс (%)' : 'Progress (%)', type: 'number', min: 0, max: 100, default: 0 },
    { key: 'deadline_start', label: lang === 'ru' ? 'Дедлайн: начало' : 'Deadline: start', type: 'date', default: '' },
    { key: 'deadline_end', label: lang === 'ru' ? 'Дедлайн: конец' : 'Deadline: end', type: 'date', default: '' },
    { key: 'image', label: lang === 'ru' ? 'Картинка (для выполненных)' : 'Image (for completed)', type: 'image', default: '' },
    { key: 'tag', label: lang === 'ru' ? 'Тип' : 'Type', type: 'select', default: '', options: [
      { value: '', label: lang === 'ru' ? '— нет —' : '— none —' },
      { value: 'paid', label: lang === 'ru' ? 'Оплачено' : 'Paid' },
      { value: 'prepaid', label: lang === 'ru' ? 'Предоплата' : 'Prepaid' },
      { value: 'free', label: lang === 'ru' ? 'Бесплатно' : 'Free' },
      { value: 'secret', label: lang === 'ru' ? 'Секрет' : 'Secret' },
    ]},
    { key: 'kind', label: lang === 'ru' ? 'Статус' : 'Status', type: 'select', default: 'in_progress', options: [
      { value: 'in_progress', label: lang === 'ru' ? 'В работе' : 'In progress' },
      { value: 'completed', label: lang === 'ru' ? 'Готово' : 'Completed' },
    ]},
  ], [lang]);

  function addInProgress() { setEditModal({ item: null, isNew: true }); }
  function editQueueItem(item) { setEditModal({ item, isNew: false }); }
  function handleSaveQueue(draft) {
    if (editModal.isNew) {
      queue.add({
        kind: draft.kind || 'in_progress',
        title: draft.title || 'New order',
        progress: draft.progress || 0,
        tag: draft.tag || null,
        deadline_start: draft.deadline_start || null,
        deadline_end: draft.deadline_end || null,
        image: draft.image || null,
        completed_date: draft.kind === 'completed' ? new Date().toISOString().slice(0, 10) : null,
      });
    } else {
      queue.update(editModal.item.id, {
        title: draft.title, progress: draft.progress,
        tag: draft.tag || null, kind: draft.kind,
        deadline_start: draft.deadline_start || null,
        deadline_end: draft.deadline_end || null,
        image: draft.image || null,
        completed_date: draft.kind === 'completed'
          ? (editModal.item.completed_date || new Date().toISOString().slice(0, 10))
          : null,
      });
    }
  }
  function deleteCompleted(id) {
    queue.remove(id);
  }

  // Pick layout
  function renderInProgress() {
    if (filteredInProgress.length === 0 && !admin) {
      return <div className="empty">{t.queue.empty}</div>;
    }
    if (layout === 'cards') {
      return (
        <div className="q-cards">
          {filteredInProgress.map((item, idx) => (
            <QueueCard key={item.id} item={animated ? item : { ...item, progress: 0 }} idx={idx} t={t} />
          ))}
        </div>
      );
    }
    if (layout === 'timeline') {
      return (
        <div className="q-timeline">
          {filteredInProgress.map((item, idx) => (
            <QueueTimeItem key={item.id} item={animated ? item : { ...item, progress: 0 }} idx={idx} t={t} />
          ))}
        </div>
      );
    }
    // list (default)
    return (
      <div className="q-list">
        {filteredInProgress.map((item, idx) => (
          <QueueRow
            key={item.id}
            item={animated ? item : { ...item, progress: 0 }}
            idx={idx}
            t={t}
            admin={admin}
            onUpdate={updateInProgress}
            onDelete={deleteInProgress}
            onEdit={editQueueItem}
            barStyle={barStyle}
            dragHandlers={admin ? dragInProgress.getHandlers(item) : null}
          />
        ))}
      </div>
    );
  }

  return (
    <section className="page anim-in">
      <PageHead
        eyebrow={`✦ ${t.queue.title} ✦`}
        title={t.queue.title}
        subtitle={t.queue.subtitle}
      />

      <div className="toolbar">
        <div className="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            placeholder={t.queue.search}
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
        </div>
        <div className="seg">
          {['all', 'paid', 'free'].map(f => (
            <button key={f} className={`seg-btn ${filter === f ? 'active' : ''}`} onClick={() => setFilter(f)}>
              {t.queue.filter[f]}
            </button>
          ))}
        </div>
        <div className="seg">
          {['progress', 'new', 'old'].map(s => (
            <button key={s} className={`seg-btn ${sort === s ? 'active' : ''}`} onClick={() => setSort(s)}>
              {t.queue.sort[s]}
            </button>
          ))}
        </div>
      </div>

      <div className="section-label">
        <span className="dot"></span>
        <span>{t.queue.inProgress}</span>
        <span style={{ color: 'var(--accent)' }}>{filteredInProgress.length}</span>
      </div>

      {renderInProgress()}

      {admin && (
        <button className="add-btn" onClick={addInProgress}>+ {t.queue.addNew}</button>
      )}

      {admin && editModal && (
        <EditItemModal
          open={true}
          onClose={() => setEditModal(null)}
          onSave={handleSaveQueue}
          fields={queueFields}
          values={editModal.item}
          title={editModal.isNew ? (lang === 'ru' ? 'Новый заказ' : 'New order') : (lang === 'ru' ? 'Редактировать' : 'Edit')}
          lang={lang}
        />
      )}

      <div className="section-label done" style={{ marginTop: 56 }}>
        <span className="dot"></span>
        <span>{t.queue.completed}</span>
        <span style={{ color: 'var(--ok)' }}>{filteredCompleted.length}</span>
      </div>

      {layout === 'cards' || layout === 'timeline' ? (
        <div className="q-timeline">
          {filteredCompleted.map((item, idx) => (
            <QueueTimeItem key={item.id} item={item} idx={idx} t={t} done />
          ))}
        </div>
      ) : (
        <div className="q-list">
          {filteredCompleted.map((item, idx) => (
            <DoneRow
              key={item.id}
              item={item}
              idx={idx}
              t={t}
              admin={admin}
              onDelete={deleteCompleted}
              onEdit={editQueueItem}
              dragHandlers={admin ? dragCompleted.getHandlers(item) : null}
            />
          ))}
        </div>
      )}
    </section>
  );
}

Object.assign(window, { QueueSection });

  </script>

  <script type="text/babel" data-presets="react">
const { useState: pfState, useEffect: pfEffect, useRef: pfRef, useMemo: pfMemo } = React;

// ══════════════════════════════════════════════════════════
//  Portfolio — folders of artwork with media manager
// ══════════════════════════════════════════════════════════

// ── Resolve any media URL to something displayable as a cover ──
// YouTube link -> its thumbnail; video file -> the file (first frame); otherwise the image itself.
function pfResolveCover(url) {
  if (!url) return { type: 'none' };
  const clean = String(url).split('?')[0].toLowerCase();
  if (String(url).includes('youtube.com') || String(url).includes('youtu.be')) {
    const id = (String(url).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]+)/) || [])[1];
    return id
      ? { type: 'youtube', thumb: `https://img.youtube.com/vi/${id}/hqdefault.jpg` }
      : { type: 'none' };
  }
  if (/\.(mp4|webm|mov|m4v)$/.test(clean)) return { type: 'video', src: String(url) };
  return { type: 'image', thumb: String(url) };
}

// ── Loading placeholder ──
// portfolio_images are deliberately kept out of the server snapshot (too heavy),
// so they always arrive over the network. Until then the grid used to render the
// "Скоро здесь появятся работы" empty-state — telling visitors the gallery was
// empty when it was merely still loading.
function GallerySkeleton({ count = 8 }) {
  return (
    <div style={{
      display: 'grid',
      gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))',
      gap: 16,
    }} aria-hidden="true">
      {Array.from({ length: count }).map((_, i) => (
        <div key={i} className="skeleton skeleton-tile"
          style={{ aspectRatio: '1 / 1', borderRadius: 'var(--radius-card, 14px)', animationDelay: `${i * 60}ms` }} />
      ))}
    </div>
  );
}

// ── Fullscreen lightbox for a single image ──
function Lightbox({ src, onClose, onPrev, onNext, current, total }) {
  pfEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape') onClose();
      if (e.key === 'ArrowLeft' && onPrev) onPrev();
      if (e.key === 'ArrowRight' && onNext) onNext();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const media = pfResolveCover(src);
  const isYT = media.type === 'youtube';
  const isVid = media.type === 'video';
  const ytId = isYT ? (String(src).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]+)/) || [])[1] : null;

  return ReactDOM.createPortal(
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, zIndex: 99999,
      background: 'rgba(0,0,0,0.92)', backdropFilter: 'blur(20px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      cursor: 'zoom-out',
    }}>
      {isYT && ytId ? (
        <iframe onClick={e => e.stopPropagation()}
          width="900" height="506"
          src={`https://www.youtube.com/embed/${ytId}?autoplay=1`}
          title="video" frameBorder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowFullScreen
          style={{ maxWidth: '92vw', maxHeight: '85vh', aspectRatio: '16/9', borderRadius: 8, cursor: 'default', boxShadow: '0 20px 80px rgba(0,0,0,0.6)' }}
        />
      ) : isVid ? (
        <video src={src} onClick={e => e.stopPropagation()} controls autoPlay loop playsInline style={{
          maxWidth: '92vw', maxHeight: '90vh', objectFit: 'contain',
          borderRadius: 8, cursor: 'default',
          boxShadow: '0 20px 80px rgba(0,0,0,0.6)',
        }} />
      ) : (
        <img src={src} onClick={e => e.stopPropagation()} style={{
          maxWidth: '92vw', maxHeight: '90vh', objectFit: 'contain',
          borderRadius: 8, cursor: 'default',
          boxShadow: '0 20px 80px rgba(0,0,0,0.6)',
        }} alt="" />
      )}

      {onPrev && <button onClick={e => { e.stopPropagation(); onPrev(); }} style={{
        position: 'absolute', left: 20, top: '50%', transform: 'translateY(-50%)',
        background: 'rgba(255,255,255,0.1)', border: 'none', color: '#fff',
        width: 48, height: 48, borderRadius: '50%', fontSize: 24, cursor: 'pointer',
      }}>‹</button>}

      {onNext && <button onClick={e => { e.stopPropagation(); onNext(); }} style={{
        position: 'absolute', right: 20, top: '50%', transform: 'translateY(-50%)',
        background: 'rgba(255,255,255,0.1)', border: 'none', color: '#fff',
        width: 48, height: 48, borderRadius: '50%', fontSize: 24, cursor: 'pointer',
      }}>›</button>}

      <button onClick={onClose} style={{
        position: 'absolute', top: 20, right: 20,
        background: 'rgba(255,255,255,0.1)', border: 'none', color: '#fff',
        width: 40, height: 40, borderRadius: '50%', fontSize: 20, cursor: 'pointer',
      }}>×</button>

      {total > 1 && <span style={{
        position: 'absolute', bottom: 24, left: '50%', transform: 'translateX(-50%)',
        fontFamily: 'var(--font-mono)', fontSize: 12, color: 'rgba(255,255,255,0.5)',
        background: 'rgba(0,0,0,0.5)', padding: '6px 16px', borderRadius: 20,
      }}>{current + 1} / {total}</span>}
    </div>,
    document.body
  );
}

// ── Category gallery (folder view — works for both public and admin) ──
function CategoryGallery({ category, images, imagesRes, t, lang, admin, onClose }) {
  const label = t.portfolio.categories[category.key] || category.key;
  const [sortMode, setSortMode] = pfState('new');
  const catImages = pfMemo(() => {
    const list = images.filter(img => img.category_id === category.id)
      .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    return sortMode === 'old' ? [...list].reverse() : list;
  }, [images, category.id, sortMode]);
  const [lightboxIdx, setLightboxIdx] = pfState(null);
  const [uploading, setUploading] = pfState(false);
  const [urlInput, setUrlInput] = pfState('');
  const fileRef = pfRef(null);
  const dragImgs = useDragReorder(catImages, imagesRes);

  function isYouTube(url) {
    return typeof url === 'string' && (url.includes('youtube.com') || url.includes('youtu.be'));
  }
  function ytId(url) { return (String(url).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]+)/) || [])[1]; }
  function ytThumb(url) { const id = ytId(url); return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : null; }
  function minSort() {
    const all = images.filter(img => img.category_id === category.id);
    return all.length ? Math.min(...all.map(i => i.sort_order || 0)) : 0;
  }

  async function addUrl() {
    if (!urlInput.trim()) return;
    if (String(category.id).startsWith('def-')) {
      alert('Категория ещё не загрузилась из базы. Подожди пару секунд и попробуй снова.');
      return;
    }
    setUploading(true);
    const result = await imagesRes.add({
      category_id: category.id,
      image_data: urlInput.trim(),
      is_cover: catImages.length === 0,
      sort_order: minSort() - 1,
    });
    setUploading(false);
    if (result) setUrlInput('');
    else alert('Не удалось добавить. Проверь URL.');
  }

  async function migrateToStorage() {
    const base64imgs = catImages.filter(i => typeof i.image_data === 'string' && i.image_data.startsWith('data:'));
    if (!base64imgs.length) { alert('Нет старых картинок для переноса'); return; }
    if (!confirm(`Перенести ${base64imgs.length} картинок в быстрое хранилище? Это займёт несколько секунд.`)) return;
    setUploading(true);
    let done = 0, failed = 0;
    for (const img of base64imgs) {
      try {
        const blob = await (await fetch(img.image_data)).blob();
        const file = new File([blob], 'img.jpg', { type: blob.type || 'image/jpeg' });
        const up = await window.uploadToStorage(file);
        if (up) { await imagesRes.update(img.id, { image_data: up.url, thumb_data: up.thumb }); done++; }
        else failed++;
      } catch (e) { failed++; }
    }
    setUploading(false);
    alert(`Готово! Перенесено: ${done}${failed ? ', ошибок: ' + failed : ''}`);
  }

  async function handleUpload(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    // Sanity check: category must be a real Supabase row (UUID)
    if (String(category.id).startsWith('def-')) {
      alert('Эта категория ещё не сохранена в базе. Дождись загрузки данных с сервера (несколько секунд) и попробуй снова.');
      if (fileRef.current) fileRef.current.value = '';
      return;
    }
    setUploading(true);
    let base = minSort();
    const empty = catImages.length === 0;
    for (let idx = 0; idx < files.length; idx++) {
      const file = files[idx];
      const up = await window.uploadToStorage(file);
      if (!up) break;
      const result = await imagesRes.add({
        category_id: category.id,
        image_data: up.url,
        thumb_data: up.thumb,
        is_cover: empty && idx === 0,
        sort_order: base - 1 - idx,
      });
      if (!result) {
        alert('Картинка загружена в хранилище, но не удалось записать в базу.');
        break;
      }
    }
    setUploading(false);
    if (fileRef.current) fileRef.current.value = '';
  }

  function setCover(imgId) {
    catImages.forEach(img => {
      if (img.id === imgId && !img.is_cover) imagesRes.update(img.id, { is_cover: true });
      if (img.id !== imgId && img.is_cover) imagesRes.update(img.id, { is_cover: false });
    });
  }

  function deleteImage(imgId) {
    const img = catImages.find(i => i.id === imgId);
    imagesRes.remove(imgId);
    if (img?.is_cover && catImages.length > 1) {
      const next = catImages.find(i => i.id !== imgId);
      if (next) imagesRes.update(next.id, { is_cover: true });
    }
  }

  return ReactDOM.createPortal(
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9990,
      background: '#0c0a08',
      overflowY: 'auto',
    }}>
      {/* ── Top bar ── */}
      <div style={{
        position: 'sticky', top: 0, zIndex: 3,
        background: 'linear-gradient(180deg, #0c0a08 60%, transparent)',
        padding: '24px 32px 40px',
      }}>
        <div style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', alignItems: 'center', gap: 16 }}>
          <button onClick={onClose} style={{
            background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.1)',
            color: '#fff', width: 42, height: 42, borderRadius: '50%', fontSize: 20,
            cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: 'background .15s',
          }} onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.12)'}
             onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,255,255,0.06)'}>
            ←
          </button>
          <div style={{ flex: 1 }}>
            <div style={{
              fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.1em',
              color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 4,
            }}>✦ {lang === 'ru' ? 'портфолио' : 'portfolio'}</div>
            <h2 style={{
              fontFamily: 'var(--font-display)', fontStyle: 'italic',
              fontSize: 'clamp(24px, 4vw, 36px)', fontWeight: 500, margin: 0, color: '#fff',
            }}>{label}</h2>
          </div>
          <span style={{
            fontFamily: 'var(--font-mono)', fontSize: 12, color: 'rgba(255,255,255,0.4)',
            padding: '6px 14px', background: 'rgba(255,255,255,0.04)',
            border: '1px solid rgba(255,255,255,0.06)', borderRadius: 20,
          }}>
            {catImages.length} {lang === 'ru' ? 'работ' : 'pieces'}
          </span>
          {catImages.length > 1 && (
            <button onClick={() => setSortMode(m => m === 'new' ? 'old' : 'new')} style={{
              fontFamily: 'var(--font-mono)', fontSize: 11, color: 'rgba(255,255,255,0.6)',
              padding: '6px 14px', background: 'rgba(255,255,255,0.04)',
              border: '1px solid rgba(255,255,255,0.1)', borderRadius: 20, cursor: 'pointer',
              whiteSpace: 'nowrap',
            }}>

                    </div>
                  )}
                </div>
              );
            })}

            {/* Upload placeholder tile */}
            {admin && (
              <div onClick={() => fileRef.current?.click()} style={{
                aspectRatio: '4/5', borderRadius: 14,
                border: '2px dashed rgba(255,255,255,0.08)',
                display: 'flex', flexDirection: 'column', alignItems: 'center',
                justifyContent: 'center', gap: 12, cursor: 'pointer',
                transition: 'border-color .2s, background .2s',

              }}

                onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(255,255,255,0.08)'; e.currentTarget.style.background = ''; }}

      {/* ── Lightbox ── */}
      {lightboxIdx !== null && catImages[lightboxIdx] && (
        <Lightbox
          src={catImages[lightboxIdx].image_data}
          current={lightboxIdx}
          total={catImages.length}
          onClose={() => setLightboxIdx(null)}
          onPrev={lightboxIdx > 0 ? () => setLightboxIdx(lightboxIdx - 1) : null}
          onNext={lightboxIdx < catImages.length - 1 ? () => setLightboxIdx(lightboxIdx + 1) : null}
        />
      )}
    </div>,
    document.body
  );
}

// ── Coverflow (top-level so React keeps it mounted → smooth animation) ──
function CoverflowRow({ catItems, idx, setIdx, openCategory, setOpenCategory, admin, lang, t, getCoverSrc, getCatCount, setPfEdit, pfRes }) {
  const total = catItems.length;
  const swipeRef = pfRef(null);

  pfEffect(() => {
    if (idx >= total && total > 0) setIdx(0);
  }, [total]);

  pfEffect(() => {
    const handler = (e) => {
      if (openCategory) return;
      if (e.key === 'ArrowLeft') setIdx(i => (i - 1 + total) % total);
      if (e.key === 'ArrowRight') setIdx(i => (i + 1) % total);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [total, openCategory]);

  if (total === 0) return null;
  const prev = () => setIdx(i => (i - 1 + total) % total);
  const next = () => setIdx(i => (i + 1) % total);

  // Keyboard already had arrows; touch had nothing, so on a phone the carousel
  // could only be moved by hitting the small side cards.
  function onTouchStart(e) {
    const t = e.touches[0];
    swipeRef.current = { x: t.clientX, y: t.clientY, done: false };
  }
  function onTouchMove(e) {
    const s = swipeRef.current;
    if (!s || s.done || total < 2) return;
    const t = e.touches[0];
    const dx = t.clientX - s.x;
    const dy = t.clientY - s.y;
    // Claim only clearly horizontal movement so the page still scrolls.
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      dx < 0 ? next() : prev();
      s.done = true;
    }
  }
  function onTouchEnd() { swipeRef.current = null; }

  return (
    <div className="pf-coverflow-outer"
      onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
      <div className="pf-coverflow">
        {catItems.map((item, i) => {
          const offset = ((i - idx) % total + total) % total;
          const normOffset = offset > total / 2 ? offset - total : offset;
          const abs = Math.abs(normOffset);
          if (abs > 2) return null;

          const isCenter = normOffset === 0;
          const side = normOffset > 0 ? 1 : -1;
          const coverSrc = getCoverSrc(item.id);
          const cover = pfResolveCover(coverSrc);
          const count = getCatCount(item.id) || item.count || 0;

          let transform, zIndex, opacity, pointerEvents;
          if (isCenter) {
            transform = 'translateX(0) scale(1) rotateY(0deg)';
            zIndex = 10; opacity = 1; pointerEvents = 'auto';
          } else if (abs === 1) {
            transform = `translateX(${side * 52}%) scale(0.82) rotateY(${-side * 18}deg)`;
            zIndex = 5; opacity = 0.75; pointerEvents = 'auto';
          } else {
            transform = `translateX(${side * 88}%) scale(0.65) rotateY(${-side * 30}deg)`;
            zIndex = 2; opacity = 0.4; pointerEvents = 'none';
          }

          return (
            <div key={item.id} className={`pf-cover-card ${isCenter ? 'active' : ''}`}
              style={{ transform, zIndex, opacity, pointerEvents, transition: 'transform 0.45s cubic-bezier(.25,.8,.25,1), opacity 0.45s ease' }}
              onClick={() => { if (isCenter) setOpenCategory(item); else setIdx(i); }}>
              <div className="pf-cover-img">
                {cover.type === 'image' || cover.type === 'youtube' ? (
                  <>
                    {/* Blurred fill background */}
                    <div className="pf-cover-blur" style={{ backgroundImage: `url("${cover.thumb}")` }} />
                    {/* Full image (contain) */}
                    <img src={cover.thumb} alt={item.key} className="pf-cover-photo" loading="lazy" decoding="async" />
                    {cover.type === 'youtube' && <span className="pf-cover-play">▶</span>}
                  </>
                ) : cover.type === 'video' ? (
                  <>
                    <video className="pf-cover-photo" src={cover.src} muted playsInline preload="metadata"
                      style={{ objectFit: 'cover' }} />
                    <span className="pf-cover-play">▶</span>
                  </>
                ) : (
                  <div style={{ width: '100%', height: '100%', background: `linear-gradient(135deg, hsl(${item.hue},60%,30%), hsl(${item.hue+30},50%,20%))`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <span style={{ fontSize: 48, fontFamily: 'var(--font-display)', color: 'rgba(255,255,255,.3)' }}>{item.key[0]?.toUpperCase()}</span>
                  </div>
                )}
              </div>
              <div className="pf-cover-info">
                {item.emoji && <span className="pf-cover-emoji">{item.emoji}</span>}
                <h3 className="pf-cover-title">{t.portfolio.categories[item.key] || item.key}</h3>
                <span className="pf-cover-count">{count} {lang === 'ru' ? 'работ' : 'works'}</span>
              </div>
              {isCenter && (
                <div className="pf-cover-open-hint">{lang === 'ru' ? 'Открыть галерею →' : 'Open gallery →'}</div>
              )}
              {admin && isCenter && (
                <div style={{ position: 'absolute', top: 10, right: 10, display: 'flex', gap: 5, zIndex: 20 }}
                  onClick={e => e.stopPropagation()}>
                  <button className="admin-btn" onClick={() => setPfEdit({ item, isNew: false })}>✎</button>
                  <button className="admin-btn danger" onClick={() => pfRes.remove(item.id)}>×</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {total > 1 && (
        <>
          <button className="pf-side-arrow pf-side-left" onClick={prev} aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><polyline points="15 18 9 12 15 6"/></svg>
            <span>{catItems[(idx - 1 + total) % total] ? (t.portfolio.categories[catItems[(idx - 1 + total) % total].key] || catItems[(idx - 1 + total) % total].key) : ''}</span>
          </button>
          <button className="pf-side-arrow pf-side-right" onClick={next} aria-label="Next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><polyline points="9 18 15 12 9 6"/></svg>
            <span>{catItems[(idx + 1) % total] ? (t.portfolio.categories[catItems[(idx + 1) % total].key] || catItems[(idx + 1) % total].key) : ''}</span>
          </button>
        </>
      )}
      {total > 1 && (
        <div className="pf-coverflow-dots">
          {catItems.map((_, i) => (
            <span key={i} className={i === idx ? 'on' : ''} onClick={() => setIdx(i)} />
          ))}
        </div>
      )}
    </div>
  );
}

// ── Main Section ──
function PortfolioSection({ t, admin, lang }) {
  const pfDefaults = pfMemo(() => [
    ...DEFAULT_PORTFOLIO.models.map((m, i) => ({ id: 'def-m-'+i, key: m.key, kind: 'model', count: m.count, hue: m.hue, sort_order: i })),
    ...DEFAULT_PORTFOLIO.illustrations.map((m, i) => ({ id: 'def-i-'+i, key: m.key, kind: 'illustration', count: m.count, hue: m.hue, sort_order: i + 100 })),
  ], []);
  const pfRes = useResource('portfolio_categories', pfDefaults);
  const imagesRes = useResource('portfolio_images', [], { noCache: true });
  const allImages = Array.isArray(imagesRes.items) ? imagesRes.items : [];

  const [openCategory, setOpenCategory] = pfState(null);
  const [pfEdit, setPfEdit] = pfState(null);
  const [coverIdx, setCoverIdx] = pfState(0);

  const pfFields = pfMemo(() => [
    { key: 'key', label: lang === 'ru' ? 'Название' : 'Name', type: 'text', required: true, default: '' },
    { key: 'emoji', label: lang === 'ru' ? 'Эмодзи (при наведении)' : 'Emoji (on hover)', type: 'text', default: '' },
    { key: 'kind', label: lang === 'ru' ? 'Вид' : 'Kind', type: 'select', default: 'model', options: [
      { value: 'model', label: lang === 'ru' ? 'Модель' : 'Model' },
      { value: 'illustration', label: lang === 'ru' ? 'Иллюстрация' : 'Illustration' },
    ]},
    { key: 'hue', label: lang === 'ru' ? 'Оттенок (0-360)' : 'Hue', type: 'number', min: 0, max: 360, default: 40 },
    { key: 'video_url', label: 'YouTube', type: 'text', default: '' },
  ], [lang]);

  function handleSavePf(draft) {
    if (pfEdit.isNew) pfRes.add({ key: draft.key, emoji: draft.emoji || '', kind: draft.kind || 'model', hue: draft.hue || 40, video_url: draft.video_url || '' });
    else pfRes.update(pfEdit.item.id, { ...draft, emoji: draft.emoji || '' });
  }

  const items = Array.isArray(pfRes.items) ? pfRes.items : [];
  const portfolio = pfMemo(() => ({
    models: items.filter(c => c.kind === 'model'),
    illustrations: items.filter(c => c.kind === 'illustration'),
  }), [items]);

  // Cover: prefer stored cover_data on category (instant, light), fall back to images
  function getCoverSrc(catId) {
    const cat = items.find(c => c.id === catId);
    if (cat && cat.cover_data) return cat.cover_data;
    const cover = allImages.find(img => img.category_id === catId && img.is_cover);
    if (cover) return cover.image_data;
    const first = allImages.find(img => img.category_id === catId);
    return first?.image_data || null;
  }

  // Count: when images loaded use real count; otherwise stored pic_count
  function getCatCount(catId) {
    if (imagesRes.loaded) {
      return allImages.filter(img => img.category_id === catId).length;
    }
    const cat = items.find(c => c.id === catId);
    return (cat && typeof cat.pic_count === 'number') ? cat.pic_count : 0;
  }

  // Keep category.cover_data + pic_count in sync after image changes / on load
  pfEffect(() => {
    if (!imagesRes.loaded || !admin) return;
    const isRealId = (id) => typeof id === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(id);
    items.forEach(cat => {
      if (!isRealId(cat.id)) return; // skip default placeholders (def-m-0 etc.)
      const imgs = allImages.filter(i => i.category_id === cat.id);
      const cover = imgs.find(i => i.is_cover) || imgs.slice().sort((a,b) => (a.sort_order||0)-(b.sort_order||0))[0];
      const newCover = cover ? cover.image_data : null;
      const newCount = imgs.length;
      if (cat.cover_data !== newCover || cat.pic_count !== newCount) {
        pfRes.update(cat.id, { cover_data: newCover, pic_count: newCount });
      }
    });
  }, [allImages, imagesRes.loaded]);

  const renderCard = (item) => ({
    item,
    coverSrc: getCoverSrc(item.id),
    count: getCatCount(item.id) || item.count || 0,
  });

  // All categories in one list
  const allCats = pfMemo(() => [
    ...portfolio.models,
    ...portfolio.illustrations,
  ], [portfolio.models, portfolio.illustrations]);

  return (
    <section id="portfolio" className="page-section stagger-children">
      <PageHead eyebrow={`✦ ${t.portfolio.title} ✦`} subtitle={t.portfolio.subtitle} />
      <CoverflowRow
        catItems={allCats}
        idx={coverIdx} setIdx={setCoverIdx}
        openCategory={openCategory} setOpenCategory={setOpenCategory}
        admin={admin} lang={lang} t={t}
        getCoverSrc={getCoverSrc} getCatCount={getCatCount}
        setPfEdit={setPfEdit} pfRes={pfRes}
      />

      {admin && (
        <button className="add-btn" onClick={() => setPfEdit({ item: null, isNew: true })}>
          + {lang === 'ru' ? 'Добавить категорию' : 'Add category'}
        </button>
      )}

      {pfEdit && (
        <EditItemModal open={true} onClose={() => setPfEdit(null)} onSave={handleSavePf}
          fields={pfFields} values={pfEdit.item}
          title={pfEdit.isNew ? (lang === 'ru' ? 'Новая категория' : 'New') : (lang === 'ru' ? 'Редактировать' : 'Edit')}
          lang={lang} />
      )}

      {openCategory && (
        <CategoryGallery
          category={openCategory} images={allImages} imagesRes={imagesRes}
          t={t} lang={lang} admin={admin}
          onClose={() => setOpenCategory(null)} />
      )}
    </section>
  );
}

Object.assign(window, { PortfolioSection });
