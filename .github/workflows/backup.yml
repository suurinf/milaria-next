# Ежедневная выгрузка базы Supabase в репозиторий.
# У бесплатного Supabase нет своих бэкапов — этот файл и есть страховка.
#
# Бэкапы коммитятся в отдельную ветку `backups`, а не в main: Amvera
# пересобирает сайт после каждого изменения main, и ежедневный бэкап
# перезапускал бы сайт без причины.
name: Backup Supabase

on:
  schedule:
    - cron: '0 2 * * *'   # каждый день в 05:00 МСК
  workflow_dispatch: {}   # и кнопка «запустить сейчас» во вкладке Actions

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Код (скрипт выгрузки и anon-ключ из index.html) — из main
      - uses: actions/checkout@v4

      # Сами бэкапы — в отдельной папке из ветки backups
      - uses: actions/checkout@v4
        with:
          ref: backups
          path: bk

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Выгрузить таблицы
        env:
          # Необязательно: скрипт возьмёт публичный anon-ключ из index.html,
          # если секрет не задан.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BACKUP_DIR: bk/backups
        run: node scripts/backup.mjs

      - name: Закоммитить в ветку backups, если что-то изменилось
        working-directory: bk
        run: |
          git config user.name  "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "Изменений нет — коммит не нужен."
          else
            git commit -m "backup: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:backups
          fi
